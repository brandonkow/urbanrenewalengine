<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KL Urban Renewal Engine</title>
<style>
:root{
  --paper:#E6EAE7; --panel:#F3F5F3; --sunk:#DCE2DF; --ink:#1B2831; --ink2:#46555E; --muted:#6F7F85; --rule:#C2CBCA;
  --zone:#E0AE36; --zone-soft:#F2DFA8;
  --ok:#2C7654; --ok-soft:#CFE3D8; --warn:#A8740F; --warn-soft:#F0E0BC; --bad:#A93733; --bad-soft:#EFD2D0;
  --official:#5A479A; --official-soft:#DCD6EE; --na:#8B989C;
  --rail:#7E8E95; --focus:#2F63B8; --railbg:#1B2831; --railfg:#E6EAE7;
  --viz1:#2A78D6; --viz2:#EB6834;
  --f:"Archivo","Helvetica Neue",Arial,sans-serif;
  --fcjk:"Archivo","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","WenQuanYi Zen Hei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10181D; --panel:#172229; --sunk:#0C1317; --ink:#E1E8E6; --ink2:#A6B4B6; --muted:#7F8F94; --rule:#2B3A42;
    --zone:#D8A62E; --zone-soft:#4A3D1A;
    --ok:#4FAE82; --ok-soft:#1C3A2D; --warn:#D9A13A; --warn-soft:#43341A; --bad:#DB6660; --bad-soft:#48221F;
    --official:#9D8BDA; --official-soft:#2D2748; --na:#6C7B80; --rail:#5E6E75; --focus:#7FA8F0; --railbg:#0A1115; --railfg:#E1E8E6; --viz1:#3987E5; --viz2:#D95926;
  }
}
:root[data-theme="dark"]{
  --paper:#10181D; --panel:#172229; --sunk:#0C1317; --ink:#E1E8E6; --ink2:#A6B4B6; --muted:#7F8F94; --rule:#2B3A42;
  --zone:#D8A62E; --zone-soft:#4A3D1A;
  --ok:#4FAE82; --ok-soft:#1C3A2D; --warn:#D9A13A; --warn-soft:#43341A; --bad:#DB6660; --bad-soft:#48221F;
  --official:#9D8BDA; --official-soft:#2D2748; --na:#6C7B80; --rail:#5E6E75; --focus:#7FA8F0; --railbg:#0A1115; --railfg:#E1E8E6; --viz1:#3987E5; --viz2:#D95926;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;font-stretch:100%}
a{color:inherit;text-decoration-color:var(--muted);text-underline-offset:2px}
a:hover{text-decoration-color:var(--ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img,svg{max-width:100%}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--railbg);color:var(--railfg);border-right:1px solid var(--rule);padding:22px 0 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:0 20px 20px;border-bottom:1px solid color-mix(in srgb,var(--railfg) 18%,transparent)}
.brand b{display:block;font-stretch:75%;font-weight:750;font-size:22px;line-height:1.05;letter-spacing:-.01em}
.brand span{display:block;margin-top:6px;font-size:12px;opacity:.7;line-height:1.35}
.nav{list-style:none;margin:14px 0 0;padding:0}
.nav button{display:flex;justify-content:space-between;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:8px 20px;cursor:pointer;color:inherit;opacity:.72;font-size:14px}
.nav button:hover{opacity:1}
.nav button[aria-current="page"]{opacity:1;background:color-mix(in srgb,var(--railfg) 10%,transparent);box-shadow:inset 3px 0 0 var(--zone)}
.nav small{font-size:11px;opacity:.7}
.rail-foot{margin-top:auto;padding:14px 20px 0;font-size:11.5px;opacity:.75;line-height:1.45;border-top:1px solid color-mix(in srgb,var(--railfg) 18%,transparent)}
.rail-foot button{background:none;border:1px solid color-mix(in srgb,var(--railfg) 35%,transparent);border-radius:3px;padding:3px 8px;cursor:pointer;margin-top:8px;font-size:11.5px}
main{padding:28px 36px 60px;min-width:0}
main:focus{outline:none}
.page{max-width:1320px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:22px}
h1{font-stretch:72%;font-weight:760;font-size:40px;line-height:1;margin:0;letter-spacing:-.012em}
.lede{color:var(--ink2);max-width:68ch;margin:8px 0 0;font-size:14.5px}
h2{font-stretch:78%;font-weight:700;font-size:21px;line-height:1.15;margin:0 0 10px}
h3{font-size:14px;font-weight:650;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{text-align:right;white-space:nowrap}
.sec{margin-top:34px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.sec-head h2{margin:0}
.sec-head .muted{font-size:12.5px}

/* controls */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
select.sel{border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:6px 8px;max-width:100%}
input[type="search"]{border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:6px 10px;min-width:240px}

/* tables */
.tw{overflow-x:auto;border-top:1px solid var(--rule)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top;text-align:left}
th{font-weight:600;font-size:12px;color:var(--ink2);font-stretch:85%;white-space:nowrap;background:var(--paper);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th[aria-sort="descending"]::after{content:" \25BE"}
th[aria-sort="ascending"]::after{content:" \25B4"}
tbody tr:hover td{background:color-mix(in srgb,var(--zone-soft) 35%,transparent)}
tr.link{cursor:pointer}
td.site{min-width:210px}
td.site b{font-weight:600}
td.site .muted{display:block;font-size:12px}
.rank{font-stretch:70%;font-weight:700;font-size:18px;color:var(--ink2)}
.score{font-weight:650}
.scorebar{display:block;height:3px;background:var(--sunk);margin-top:3px;width:64px}
.scorebar i{display:block;height:100%;background:var(--ink)}
.neg{color:var(--bad)}
.pos{color:var(--ok)}

/* provenance badges: fill = official, solid = evidence, dashed = assumption/proxy, dotted = model */
.src{display:inline-block;font-size:11px;line-height:1;padding:3px 6px 3px;border-radius:3px;white-space:nowrap;vertical-align:1px;font-stretch:88%;font-weight:550}
.src.t1{background:var(--official);color:#fff;border:1px solid var(--official)}
.src.t2{border:1px solid var(--ink2);color:var(--ink2)}
.src.t3{border:1px dashed var(--warn);color:var(--warn)}
.src.t4{border:1px dotted var(--ink2);color:var(--ink2);font-style:italic}
.src.t0{border:1px dashed var(--bad);color:var(--bad)}
.src.edit{border:1px dashed var(--focus);color:var(--focus)}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;font-weight:550}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.na{color:var(--na)} .chip.off{color:var(--official)}
.verdict{display:inline-block;font-size:12px;padding:2px 7px;border-radius:3px;white-space:nowrap;font-weight:600;font-stretch:88%}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.na{background:var(--sunk);color:var(--muted)}
.verdict.off{background:var(--official-soft);color:var(--official)}
.stage{font-size:12px;color:var(--ink2);white-space:nowrap}
.stage::before{content:"";display:inline-block;width:14px;height:6px;margin-right:5px;border:1px solid var(--ink2);vertical-align:1px}
.stage.s2::before{background:linear-gradient(90deg,var(--ink2) 30%,transparent 30%)}
.stage.s3::before{background:linear-gradient(90deg,var(--ink2) 55%,transparent 55%)}
.stage.s4::before{background:linear-gradient(90deg,var(--ink2) 45%,transparent 45%);border-style:dashed}
.stage.s5::before{background:linear-gradient(90deg,var(--ink2) 80%,transparent 80%)}
.stage.s8::before{border-color:var(--bad);background:repeating-linear-gradient(135deg,var(--bad) 0 1px,transparent 1px 3px)}

/* decision rule hero */
.rule{background:var(--panel);border-left:4px solid var(--zone);padding:20px 24px 22px;margin-bottom:6px}
.rule-top{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap}
.rule-eq{font-stretch:68%;font-weight:760;font-size:34px;line-height:1.05;letter-spacing:-.01em;margin:0}
.rule-eq .gt{color:var(--muted);font-weight:400;padding:0 .18em}
.bars{margin-top:18px;display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:10px 16px;align-items:center}
.bars .lab{font-size:13px;color:var(--ink2);line-height:1.3}
.bars .lab b{display:block;color:var(--ink);font-size:20px;font-stretch:78%;font-weight:700}
.bar{height:26px;background:var(--sunk);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0}
.bar i.avail{background:var(--ok)}
.bar i.req{background:var(--ink)}
.bar i.gap{background:repeating-linear-gradient(135deg,var(--bad) 0 3px,transparent 3px 7px);border:1px solid var(--bad)}
.rule-foot{margin-top:14px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink2)}

/* key-value grids */
.kv{display:grid;grid-template-columns:minmax(140px,max-content) 1fr;gap:6px 18px;margin:0}
.kv dt{color:var(--ink2);font-size:13px}
.kv dd{margin:0;font-size:13.5px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:34px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.block{margin-bottom:28px}
.block>h3{border-bottom:1px solid var(--rule);padding-bottom:5px;margin-bottom:10px;font-size:13px;color:var(--ink2);font-weight:600}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;border-top:2px solid var(--ink)}
.metric{padding:10px 12px 12px 0;border-bottom:1px solid var(--rule)}
.metric .v{font-stretch:75%;font-weight:720;font-size:25px;line-height:1.1;display:block;letter-spacing:-.005em}
.metric .k{font-size:12px;color:var(--ink2);display:block;margin-top:2px}
.metric .src{margin-top:5px}

/* interest grid (signature) */
.igrid{display:flex;flex-wrap:wrap;gap:3px;margin:12px 0 8px;max-width:640px}
.igrid i{width:16px;height:16px;border:1px solid var(--ok);background:var(--ok);position:relative;display:block}
.igrid i.un{background:repeating-linear-gradient(135deg,var(--bad) 0 1.5px,transparent 1.5px 4px);border-color:var(--bad)}
.igrid i.part{background:repeating-linear-gradient(135deg,var(--bad) 0 1.5px,transparent 1.5px 4px);border-color:var(--bad)}
.igrid i.part b{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.igrid i.extra{background:transparent;border:1px dashed var(--ok)}
.igrid-cap{font-size:13px;color:var(--ink2);max-width:70ch}
.igrid-cap b{color:var(--ink)}

/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:22px 28px}
.chart h3{font-size:13px;margin:0 0 2px}
.chart p{font-size:12px;color:var(--muted);margin:0 0 4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{stroke:var(--rule);stroke-width:1}
.ax0{stroke:var(--ink2);stroke-width:1}
.tick{fill:var(--muted);font-size:10.5px;font-family:var(--f)}
.axl{fill:var(--ink2);font-size:11px;font-family:var(--f)}
.ln{fill:none;stroke-width:2}
.ln.c0{stroke:var(--ink)} .ln.c1{stroke:var(--zone)} .ln.c2{stroke:var(--official)} .ln.c3{stroke:var(--muted)}
.ref{stroke:var(--bad);stroke-width:1.2;stroke-dasharray:4 3}
.ref2{stroke:var(--ok);stroke-width:1.2;stroke-dasharray:2 3}
.reflab{font-size:10.5px;font-family:var(--f);fill:var(--bad)}
.reflab2{font-size:10.5px;font-family:var(--f);fill:var(--ok)}
.dot{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.leg{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);margin-top:2px}
.leg span::before{content:"";display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:3px;background:var(--c)}

/* lab */
.lab-grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:34px;align-items:start}
.ctrls{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding-right:6px}
.ctrl{padding:9px 0 10px;border-bottom:1px solid var(--rule)}
.ctrl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctrl label{font-size:13px;color:var(--ink2)}
.ctrl output{font-weight:650;font-size:14px}
.ctrl input[type="range"]{width:100%;margin:6px 0 2px;accent-color:var(--ink)}
.ctrl .hint{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.ctrl-group{font-size:12px;font-weight:650;color:var(--ink);margin:18px 0 0;padding-top:4px}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
.tog input{accent-color:var(--ink);width:15px;height:15px}
.cost td{padding:4px 8px}
.cost tr.tot td{font-weight:700;border-top:2px solid var(--ink)}

/* heat tables */
.heat td.num{font-weight:550}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px 34px}
.heat td.h-ok{background:var(--ok-soft);color:var(--ok)}
.heat td.h-warn{background:var(--warn-soft);color:var(--warn)}
.heat td.h-bad{background:var(--bad-soft);color:var(--bad)}
.heat td.cur{outline:2px solid var(--ink);outline-offset:-2px}

/* map */
.map-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.map-box{background:var(--panel);border:1px solid var(--rule);position:relative}
.map-box svg{display:block;width:100%;height:auto;max-height:82vh}
.grat{stroke:var(--rule);stroke-width:.6}
.grat-l{fill:var(--muted);font-size:9.5px;font-family:var(--f)}
.railln{fill:none;stroke:var(--rail);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;opacity:.75}
.stn{fill:var(--panel);stroke:var(--rail);stroke-width:1.3}
.stn-l{fill:var(--muted);font-size:9px;font-family:var(--f)}
.tpz{fill:var(--rail);fill-opacity:.14;stroke:none}
.tiz{fill:var(--rail);fill-opacity:.06;stroke:var(--rail);stroke-opacity:.4;stroke-width:.6;stroke-dasharray:2 2}
.pin{cursor:pointer}
.pin circle.core{stroke:var(--panel);stroke-width:1.5}
.pin circle.ring{fill:none;stroke:var(--official);stroke-width:2}
.pin text{font-size:10.5px;font-family:var(--f);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;font-weight:550}
.pin.sel circle.core{stroke:var(--zone);stroke-width:3}
.pin:focus-visible circle.core{stroke:var(--focus);stroke-width:3}
.f-ok{fill:var(--ok)} .f-warn{fill:var(--warn)} .f-bad{fill:var(--bad)} .f-na{fill:var(--na)}
.layers label{display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.layers input{accent-color:var(--ink)}
.legend-row{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:2px 0}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.side{background:var(--panel);border:1px solid var(--rule);padding:16px}
.note{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn-soft) 55%,transparent);padding:10px 14px;font-size:13px;margin:12px 0}
.note.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad-soft) 55%,transparent)}
.note.info{border-color:var(--ink2);background:var(--panel)}

/* issues + checklist */
.issues{counter-reset:iss;list-style:none;padding:0;margin:0}
.issues li{padding:12px 0 12px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:110px 1fr;gap:14px}
.issues .impact{font-size:12px;font-weight:650}
.check{list-style:none;padding:0;margin:0}
.check li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:start}
.check input{accent-color:var(--ok);width:15px;height:15px;margin-top:3px}
.check .done{text-decoration:line-through;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--rule);background:var(--panel);border-radius:3px;padding:3px 9px;font-size:12px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
code,.formula{font-family:var(--f);font-stretch:85%;background:var(--sunk);padding:1px 5px;border-radius:2px}
pre.formula{padding:12px 14px;white-space:pre-wrap;line-height:1.55;font-size:13px;margin:0 0 12px}
.wt{width:64px;border:1px solid var(--rule);background:var(--panel);padding:3px 6px;border-radius:3px;text-align:right}
.struct{table-layout:fixed;width:100%}
.struct th:first-child,.struct td:first-child{width:28%}
.struct td,.struct th{white-space:normal;overflow-wrap:anywhere}
.cost tr.best td{background:color-mix(in srgb,var(--zone-soft) 50%,transparent)}
.struct .best{background:color-mix(in srgb,var(--zone-soft) 50%,transparent)}
.struct th.best{color:var(--ink)}
.read{margin:0;padding-left:18px}.read li{margin:0 0 7px;max-width:82ch}
.consent{position:relative;height:16px;background:var(--sunk);margin:30px 0 8px;max-width:900px}
.consent i{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.consent b{position:absolute;top:-5px;bottom:-5px;border-left:2px dashed var(--muted)}
.consent b.req{border-left:2px solid var(--ink)}
.consent b span{position:absolute;top:-19px;left:0;transform:translateX(-50%);font-size:11px;font-weight:500;color:var(--ink2);white-space:nowrap}
.consent b.req span{transform:translateX(-100%);color:var(--ink);font-weight:650}
.agrid{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.aq{width:40px;height:30px;font-size:10.5px;border:1px solid var(--rule);background:var(--panel);border-radius:2px;cursor:pointer;font-stretch:78%;padding:0;color:var(--ink2)}
.aq.a-c{border-color:var(--ink2);box-shadow:inset 0 -3px 0 var(--ink2);color:var(--ink)}
.aq.a-i{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:650}
.aq.a-s{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:650}
.aq.a-r{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:650}
.aq.on{outline:2px solid var(--zone);outline-offset:1px}
.alegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2)}
.alegend .aq{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:6px;cursor:default}
.sync{margin-top:10px;display:flex;gap:6px;align-items:center}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--na)}
.sync[data-mode="synced"]::before{background:#5FC08F}
.sync[data-mode="saving"]::before,.sync[data-mode="connecting"]::before{background:var(--zone)}
.ctrl input[disabled]{opacity:.35}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* owner-test odds */
.mc-ok{fill:var(--ok)} .mc-bad{fill:var(--bad)} .mc-lo{fill:var(--viz1)} .mc-hi{fill:var(--viz2)}
.mc-ref{stroke:var(--ink);stroke-width:1.4}

max interests = RLV ÷ (package × (1 + holdout))
required ASP = (budget ÷ land sf ÷ PR + cost per GFA sf)

required PR = budget ÷ land sf ÷ (ASP × k − cost per GFA sf)
decision rule: RLV &gt; owner budget</pre></div>

owner uplift today = headline value ÷ (1 + r)^years ÷ current − 1
your fee = rate × owner consideration (or × GDV)

  open space ≤10%; transit zone ≤20%

effective PR = base PR × (1 + share)

Category A (density, fully residential)
units = persons per acre × acres ÷ persons per unit

    }

  if (sel) sel.onchange = () => go("#/incentive/" + sel.value);

  if (bg) bg.onchange = () => {
    d.big = bg.checked;
    commit("#i_big");
  };

    const el = root.querySelector("#" + id);
    if (!el) continue;
    const [k, f] = INC_SL[id];
    el.oninput = () => {
      root.querySelector("#" + id + "_o").textContent = f(parseFloat(el.value));
    };
    el.onchange = () => {
      d[k] = parseFloat(el.value);
      commit("#" + id);

    store.set("inc", INC);
    render();
    toast("Reset to our reading of the guideline");
  });
