<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KL Urban Renewal Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..800;1,62..125,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6EAE7; --panel:#F3F5F3; --sunk:#DCE2DF; --ink:#1B2831; --ink2:#46555E; --muted:#6F7F85; --rule:#C2CBCA;
  --zone:#E0AE36; --zone-soft:#F2DFA8;
  --ok:#2C7654; --ok-soft:#CFE3D8; --warn:#A8740F; --warn-soft:#F0E0BC; --bad:#A93733; --bad-soft:#EFD2D0;
  --official:#5A479A; --official-soft:#DCD6EE; --na:#8B989C;
  --rail:#7E8E95; --focus:#2F63B8; --railbg:#1B2831; --railfg:#E6EAE7;
  --viz1:#2A78D6; --viz2:#EB6834;
  --f:"Archivo","Helvetica Neue",Arial,sans-serif;
  --fcjk:"Archivo","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","WenQuanYi Zen Hei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10181D; --panel:#172229; --sunk:#0C1317; --ink:#E1E8E6; --ink2:#A6B4B6; --muted:#7F8F94; --rule:#2B3A42;
    --zone:#D8A62E; --zone-soft:#4A3D1A;
    --ok:#4FAE82; --ok-soft:#1C3A2D; --warn:#D9A13A; --warn-soft:#43341A; --bad:#DB6660; --bad-soft:#48221F;
    --official:#9D8BDA; --official-soft:#2D2748; --na:#6C7B80; --rail:#5E6E75; --focus:#7FA8F0; --railbg:#0A1115; --railfg:#E1E8E6; --viz1:#3987E5; --viz2:#D95926;
  }
}
:root[data-theme="dark"]{
  --paper:#10181D; --panel:#172229; --sunk:#0C1317; --ink:#E1E8E6; --ink2:#A6B4B6; --muted:#7F8F94; --rule:#2B3A42;
  --zone:#D8A62E; --zone-soft:#4A3D1A;
  --ok:#4FAE82; --ok-soft:#1C3A2D; --warn:#D9A13A; --warn-soft:#43341A; --bad:#DB6660; --bad-soft:#48221F;
  --official:#9D8BDA; --official-soft:#2D2748; --na:#6C7B80; --rail:#5E6E75; --focus:#7FA8F0; --railbg:#0A1115; --railfg:#E1E8E6; --viz1:#3987E5; --viz2:#D95926;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;font-stretch:100%}
a{color:inherit;text-decoration-color:var(--muted);text-underline-offset:2px}
a:hover{text-decoration-color:var(--ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img,svg{max-width:100%}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--railbg);color:var(--railfg);border-right:1px solid var(--rule);padding:22px 0 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:0 20px 20px;border-bottom:1px solid color-mix(in srgb,var(--railfg) 18%,transparent)}
.brand b{display:block;font-stretch:75%;font-weight:750;font-size:22px;line-height:1.05;letter-spacing:-.01em}
.brand span{display:block;margin-top:6px;font-size:12px;opacity:.7;line-height:1.35}
.nav{list-style:none;margin:14px 0 0;padding:0}
.nav button{display:flex;justify-content:space-between;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:8px 20px;cursor:pointer;color:inherit;opacity:.72;font-size:14px}
.nav button:hover{opacity:1}
.nav button[aria-current="page"]{opacity:1;background:color-mix(in srgb,var(--railfg) 10%,transparent);box-shadow:inset 3px 0 0 var(--zone)}
.nav small{font-size:11px;opacity:.7}
.rail-foot{margin-top:auto;padding:14px 20px 0;font-size:11.5px;opacity:.75;line-height:1.45;border-top:1px solid color-mix(in srgb,var(--railfg) 18%,transparent)}
.rail-foot button{background:none;border:1px solid color-mix(in srgb,var(--railfg) 35%,transparent);border-radius:3px;padding:3px 8px;cursor:pointer;margin-top:8px;font-size:11.5px}
main{padding:28px 36px 60px;min-width:0}
main:focus{outline:none}
.page{max-width:1320px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:22px}
h1{font-stretch:72%;font-weight:760;font-size:40px;line-height:1;margin:0;letter-spacing:-.012em}
.lede{color:var(--ink2);max-width:68ch;margin:8px 0 0;font-size:14.5px}
h2{font-stretch:78%;font-weight:700;font-size:21px;line-height:1.15;margin:0 0 10px}
h3{font-size:14px;font-weight:650;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{text-align:right;white-space:nowrap}
.sec{margin-top:34px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.sec-head h2{margin:0}
.sec-head .muted{font-size:12.5px}

/* controls */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
select.sel{border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:6px 8px;max-width:100%}
input[type="search"]{border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:6px 10px;min-width:240px}

/* tables */
.tw{overflow-x:auto;border-top:1px solid var(--rule)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top;text-align:left}
th{font-weight:600;font-size:12px;color:var(--ink2);font-stretch:85%;white-space:nowrap;background:var(--paper);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th[aria-sort="descending"]::after{content:" \25BE"}
th[aria-sort="ascending"]::after{content:" \25B4"}
tbody tr:hover td{background:color-mix(in srgb,var(--zone-soft) 35%,transparent)}
tr.link{cursor:pointer}
td.site{min-width:210px}
td.site b{font-weight:600}
td.site .muted{display:block;font-size:12px}
.rank{font-stretch:70%;font-weight:700;font-size:18px;color:var(--ink2)}
.score{font-weight:650}
.scorebar{display:block;height:3px;background:var(--sunk);margin-top:3px;width:64px}
.scorebar i{display:block;height:100%;background:var(--ink)}
.neg{color:var(--bad)}
.pos{color:var(--ok)}

/* provenance badges: fill = official, solid = evidence, dashed = assumption/proxy, dotted = model */
.src{display:inline-block;font-size:11px;line-height:1;padding:3px 6px 3px;border-radius:3px;white-space:nowrap;vertical-align:1px;font-stretch:88%;font-weight:550}
.src.t1{background:var(--official);color:#fff;border:1px solid var(--official)}
.src.t2{border:1px solid var(--ink2);color:var(--ink2)}
.src.t3{border:1px dashed var(--warn);color:var(--warn)}
.src.t4{border:1px dotted var(--ink2);color:var(--ink2);font-style:italic}
.src.t0{border:1px dashed var(--bad);color:var(--bad)}
.src.edit{border:1px dashed var(--focus);color:var(--focus)}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;font-weight:550}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.na{color:var(--na)} .chip.off{color:var(--official)}
.verdict{display:inline-block;font-size:12px;padding:2px 7px;border-radius:3px;white-space:nowrap;font-weight:600;font-stretch:88%}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.na{background:var(--sunk);color:var(--muted)}
.verdict.off{background:var(--official-soft);color:var(--official)}
.stage{font-size:12px;color:var(--ink2);white-space:nowrap}
.stage::before{content:"";display:inline-block;width:14px;height:6px;margin-right:5px;border:1px solid var(--ink2);vertical-align:1px}
.stage.s2::before{background:linear-gradient(90deg,var(--ink2) 30%,transparent 30%)}
.stage.s3::before{background:linear-gradient(90deg,var(--ink2) 55%,transparent 55%)}
.stage.s4::before{background:linear-gradient(90deg,var(--ink2) 45%,transparent 45%);border-style:dashed}
.stage.s5::before{background:linear-gradient(90deg,var(--ink2) 80%,transparent 80%)}
.stage.s8::before{border-color:var(--bad);background:repeating-linear-gradient(135deg,var(--bad) 0 1px,transparent 1px 3px)}

/* decision rule hero */
.rule{background:var(--panel);border-left:4px solid var(--zone);padding:20px 24px 22px;margin-bottom:6px}
.rule-top{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap}
.rule-eq{font-stretch:68%;font-weight:760;font-size:34px;line-height:1.05;letter-spacing:-.01em;margin:0}
.rule-eq .gt{color:var(--muted);font-weight:400;padding:0 .18em}
.bars{margin-top:18px;display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:10px 16px;align-items:center}
.bars .lab{font-size:13px;color:var(--ink2);line-height:1.3}
.bars .lab b{display:block;color:var(--ink);font-size:20px;font-stretch:78%;font-weight:700}
.bar{height:26px;background:var(--sunk);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0}
.bar i.avail{background:var(--ok)}
.bar i.req{background:var(--ink)}
.bar i.gap{background:repeating-linear-gradient(135deg,var(--bad) 0 3px,transparent 3px 7px);border:1px solid var(--bad)}
.rule-foot{margin-top:14px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink2)}

/* key-value grids */
.kv{display:grid;grid-template-columns:minmax(140px,max-content) 1fr;gap:6px 18px;margin:0}
.kv dt{color:var(--ink2);font-size:13px}
.kv dd{margin:0;font-size:13.5px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:34px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.block{margin-bottom:28px}
.block>h3{border-bottom:1px solid var(--rule);padding-bottom:5px;margin-bottom:10px;font-size:13px;color:var(--ink2);font-weight:600}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;border-top:2px solid var(--ink)}
.metric{padding:10px 12px 12px 0;border-bottom:1px solid var(--rule)}
.metric .v{font-stretch:75%;font-weight:720;font-size:25px;line-height:1.1;display:block;letter-spacing:-.005em}
.metric .k{font-size:12px;color:var(--ink2);display:block;margin-top:2px}
.metric .src{margin-top:5px}

/* interest grid (signature) */
.igrid{display:flex;flex-wrap:wrap;gap:3px;margin:12px 0 8px;max-width:640px}
.igrid i{width:16px;height:16px;border:1px solid var(--ok);background:var(--ok);position:relative;display:block}
.igrid i.un{background:repeating-linear-gradient(135deg,var(--bad) 0 1.5px,transparent 1.5px 4px);border-color:var(--bad)}
.igrid i.part{background:repeating-linear-gradient(135deg,var(--bad) 0 1.5px,transparent 1.5px 4px);border-color:var(--bad)}
.igrid i.part b{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.igrid i.extra{background:transparent;border:1px dashed var(--ok)}
.igrid-cap{font-size:13px;color:var(--ink2);max-width:70ch}
.igrid-cap b{color:var(--ink)}

/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:22px 28px}
.chart h3{font-size:13px;margin:0 0 2px}
.chart p{font-size:12px;color:var(--muted);margin:0 0 4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{stroke:var(--rule);stroke-width:1}
.ax0{stroke:var(--ink2);stroke-width:1}
.tick{fill:var(--muted);font-size:10.5px;font-family:var(--f)}
.axl{fill:var(--ink2);font-size:11px;font-family:var(--f)}
.ln{fill:none;stroke-width:2}
.ln.c0{stroke:var(--ink)} .ln.c1{stroke:var(--zone)} .ln.c2{stroke:var(--official)} .ln.c3{stroke:var(--muted)}
.ref{stroke:var(--bad);stroke-width:1.2;stroke-dasharray:4 3}
.ref2{stroke:var(--ok);stroke-width:1.2;stroke-dasharray:2 3}
.reflab{font-size:10.5px;font-family:var(--f);fill:var(--bad)}
.reflab2{font-size:10.5px;font-family:var(--f);fill:var(--ok)}
.dot{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.leg{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);margin-top:2px}
.leg span::before{content:"";display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:3px;background:var(--c)}

/* lab */
.lab-grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:34px;align-items:start}
.ctrls{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding-right:6px}
.ctrl{padding:9px 0 10px;border-bottom:1px solid var(--rule)}
.ctrl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctrl label{font-size:13px;color:var(--ink2)}
.ctrl output{font-weight:650;font-size:14px}
.ctrl input[type="range"]{width:100%;margin:6px 0 2px;accent-color:var(--ink)}
.ctrl .hint{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.ctrl-group{font-size:12px;font-weight:650;color:var(--ink);margin:18px 0 0;padding-top:4px}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
.tog input{accent-color:var(--ink);width:15px;height:15px}
.cost td{padding:4px 8px}
.cost tr.tot td{font-weight:700;border-top:2px solid var(--ink)}

/* heat tables */
.heat td.num{font-weight:550}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px 34px}
.heat td.h-ok{background:var(--ok-soft);color:var(--ok)}
.heat td.h-warn{background:var(--warn-soft);color:var(--warn)}
.heat td.h-bad{background:var(--bad-soft);color:var(--bad)}
.heat td.cur{outline:2px solid var(--ink);outline-offset:-2px}

/* map */
.map-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.map-box{background:var(--panel);border:1px solid var(--rule);position:relative}
.map-box svg{display:block;width:100%;height:auto;max-height:82vh}
.grat{stroke:var(--rule);stroke-width:.6}
.grat-l{fill:var(--muted);font-size:9.5px;font-family:var(--f)}
.railln{fill:none;stroke:var(--rail);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;opacity:.75}
.stn{fill:var(--panel);stroke:var(--rail);stroke-width:1.3}
.stn-l{fill:var(--muted);font-size:9px;font-family:var(--f)}
.tpz{fill:var(--rail);fill-opacity:.14;stroke:none}
.tiz{fill:var(--rail);fill-opacity:.06;stroke:var(--rail);stroke-opacity:.4;stroke-width:.6;stroke-dasharray:2 2}
.pin{cursor:pointer}
.pin circle.core{stroke:var(--panel);stroke-width:1.5}
.pin circle.ring{fill:none;stroke:var(--official);stroke-width:2}
.pin text{font-size:10.5px;font-family:var(--f);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;font-weight:550}
.pin.sel circle.core{stroke:var(--zone);stroke-width:3}
.pin:focus-visible circle.core{stroke:var(--focus);stroke-width:3}
.f-ok{fill:var(--ok)} .f-warn{fill:var(--warn)} .f-bad{fill:var(--bad)} .f-na{fill:var(--na)}
.layers label{display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.layers input{accent-color:var(--ink)}
.legend-row{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:2px 0}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.side{background:var(--panel);border:1px solid var(--rule);padding:16px}
.note{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn-soft) 55%,transparent);padding:10px 14px;font-size:13px;margin:12px 0}
.note.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad-soft) 55%,transparent)}
.note.info{border-color:var(--ink2);background:var(--panel)}

/* issues + checklist */
.issues{counter-reset:iss;list-style:none;padding:0;margin:0}
.issues li{padding:12px 0 12px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:110px 1fr;gap:14px}
.issues .impact{font-size:12px;font-weight:650}
.check{list-style:none;padding:0;margin:0}
.check li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:start}
.check input{accent-color:var(--ok);width:15px;height:15px;margin-top:3px}
.check .done{text-decoration:line-through;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--rule);background:var(--panel);border-radius:3px;padding:3px 9px;font-size:12px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
code,.formula{font-family:var(--f);font-stretch:85%;background:var(--sunk);padding:1px 5px;border-radius:2px}
pre.formula{padding:12px 14px;white-space:pre-wrap;line-height:1.55;font-size:13px;margin:0 0 12px}
.wt{width:64px;border:1px solid var(--rule);background:var(--panel);padding:3px 6px;border-radius:3px;text-align:right}
.struct{table-layout:fixed;width:100%}
.struct th:first-child,.struct td:first-child{width:28%}
.struct td,.struct th{white-space:normal;overflow-wrap:anywhere}
.cost tr.best td{background:color-mix(in srgb,var(--zone-soft) 50%,transparent)}
.struct .best{background:color-mix(in srgb,var(--zone-soft) 50%,transparent)}
.struct th.best{color:var(--ink)}
.read{margin:0;padding-left:18px}.read li{margin:0 0 7px;max-width:82ch}
.consent{position:relative;height:16px;background:var(--sunk);margin:30px 0 8px;max-width:900px}
.consent i{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.consent b{position:absolute;top:-5px;bottom:-5px;border-left:2px dashed var(--muted)}
.consent b.req{border-left:2px solid var(--ink)}
.consent b span{position:absolute;top:-19px;left:0;transform:translateX(-50%);font-size:11px;font-weight:500;color:var(--ink2);white-space:nowrap}
.consent b.req span{transform:translateX(-100%);color:var(--ink);font-weight:650}
.agrid{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.aq{width:40px;height:30px;font-size:10.5px;border:1px solid var(--rule);background:var(--panel);border-radius:2px;cursor:pointer;font-stretch:78%;padding:0;color:var(--ink2)}
.aq.a-c{border-color:var(--ink2);box-shadow:inset 0 -3px 0 var(--ink2);color:var(--ink)}
.aq.a-i{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:650}
.aq.a-s{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:650}
.aq.a-r{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:650}
.aq.on{outline:2px solid var(--zone);outline-offset:1px}
.alegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2)}
.alegend .aq{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:6px;cursor:default}
.sync{margin-top:10px;display:flex;gap:6px;align-items:center}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--na)}
.sync[data-mode="synced"]::before{background:#5FC08F}
.sync[data-mode="saving"]::before,.sync[data-mode="connecting"]::before{background:var(--zone)}
.ctrl input[disabled]{opacity:.35}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* owner-test odds */
.mc-ok{fill:var(--ok)} .mc-bad{fill:var(--bad)} .mc-lo{fill:var(--viz1)} .mc-hi{fill:var(--viz2)}
.mc-ref{stroke:var(--ink);stroke-width:1.4}
.mc-in{border:1px solid var(--rule);background:var(--panel);border-radius:3px;padding:3px 5px;text-align:right;font-size:12.5px;max-width:100%}
.mc-p{font-stretch:78%;font-size:18px;font-weight:720;font-variant-numeric:proportional-nums}
tr.mc-cur td{background:color-mix(in srgb,var(--zone-soft) 45%,transparent)}

/* owner briefing packs (#/pack): an A4 sheet on screen, the only thing printed */
.pk-bar{display:flex;gap:12px 18px;flex-wrap:wrap;align-items:flex-end;margin:0 0 12px}
.pk-bar .grp{display:flex;flex-direction:column;gap:4px}
.pk-bar .grp>span{font-size:12px;color:var(--muted)}
.pk-status{max-width:210mm}
.pk-contact{max-width:210mm;margin:0 0 16px;font-size:13px}
.pk-contact summary{cursor:pointer;color:var(--ink2)}
.pk-contact .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px 14px;margin-top:8px}
.pk-contact label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
.pk-contact input{border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:6px 8px;min-width:0}
.pack{font-family:var(--fcjk);background:var(--panel);color:var(--ink);border:1px solid var(--rule);max-width:210mm;padding:11mm 12mm 10mm;font-size:13px;line-height:1.5;overflow-wrap:break-word}
.pack[lang="zh-Hans"]{line-height:1.6}
.pk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 20px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px}
.pk-kick{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.pack[lang="zh-Hans"] .pk-kick{letter-spacing:.12em}
.pk-title{font-stretch:75%;font-weight:760;font-size:30px;line-height:1.05;margin:2px 0 3px;letter-spacing:-.01em}
.pk-place{font-size:12.5px;color:var(--ink2)}
.pk-scen{text-align:right;font-size:12px;max-width:62mm}
.pk-scen b{display:inline-block;background:var(--zone-soft);color:var(--ink);padding:3px 8px;border-radius:3px;font-weight:650}
.pk-stamp{display:inline-block;margin-top:6px;border:1px dashed var(--bad);color:var(--bad);padding:2px 7px;border-radius:3px;font-size:11px;font-weight:650}
.pk-made{font-size:11px;color:var(--muted);margin:0 0 10px}
.pack h2{font-stretch:80%;font-weight:720;font-size:17px;margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--rule)}
.pack h3{font-size:13px;margin:10px 0 4px}
.pack p{margin:0 0 7px}
.pk-basis{background:var(--sunk);padding:8px 11px;border-left:3px solid var(--zone);font-size:12.5px;margin:6px 0 8px}
.pk-basis p:last-child{margin:0}
.pk-dep{border-left:3px solid var(--warn);background:var(--warn-soft);padding:6px 10px;font-size:12.5px;font-weight:600;margin:6px 0 8px}
.pk-tw{overflow-x:auto}
.pk-t{border-collapse:collapse;width:100%;font-size:12.5px;table-layout:fixed;min-width:520px}
.pk-t th,.pk-t td{padding:5px 7px;border-bottom:1px solid var(--rule);vertical-align:top;text-align:left;white-space:normal;position:static;background:none}
.pk-t thead th{font-size:12.5px;color:var(--ink);font-weight:700;border-bottom:2px solid var(--ink)}
.pk-t thead th small{display:block;font-weight:500;color:var(--ink2);font-size:11px;margin-top:1px}
.pk-t th:first-child,.pk-t td:first-child{width:24%;color:var(--ink2)}
.pk-t tr.grp td{background:var(--sunk);color:var(--ink);font-weight:650;padding-top:6px}
.pk-t tr.grp td span{font-weight:500;color:var(--ink2)}
.pk-t td.how{font-size:11.5px;color:var(--ink2)}
.pk-t td.off{color:var(--muted);font-style:italic;font-size:11.5px}
.pk-fig{font-weight:700;white-space:nowrap}
.pk-sub{display:block;font-size:11px;color:var(--muted)}
.pack .src{font-size:9.5px;padding:2px 4px;vertical-align:1px;margin-left:3px}
.pk-nr{border:2px solid var(--bad);padding:10px 13px;margin:8px 0}
.pk-nr h3{color:var(--bad);margin-top:0;font-size:15px}
.pk-nr ul{margin:6px 0 0;padding-left:18px}
.pk-nr li{margin-bottom:4px}
.pk-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 22px}
.pk-steps{list-style:none;margin:4px 0 4px;padding:0;counter-reset:pks}
.pk-steps li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:2px 8px;padding:4px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.pk-steps li::before{counter-increment:pks;content:counter(pks);font-weight:700;color:var(--ink2)}
.pk-steps li span:last-child{color:var(--ink2);text-align:right;font-size:11.5px;max-width:42mm}
.pk-rights{margin:0;padding-left:18px}
.pk-rights li{margin-bottom:4px}
.pk-rights li:first-child{font-weight:650}
.pk-faq dt{font-weight:650;margin-top:6px}
.pk-faq dd{margin:1px 0 0}
.pk-contactbox{border:1px solid var(--ink2);padding:8px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 18px;font-size:12.5px}
.pk-contactbox .ph{color:var(--muted)}
.pk-disc{font-size:11.5px;color:var(--ink2);border-top:1px solid var(--rule);padding-top:6px;margin-top:10px}
.pk-legend{font-size:10.5px;color:var(--muted);margin-top:4px}
.pk-keep{break-inside:avoid}
@media (max-width:780px){
  .pack{padding:16px 14px}
  .pk-scen{text-align:left;max-width:none}
  .pk-cols,.pk-contactbox{grid-template-columns:minmax(0,1fr)}
  .pk-title{font-size:25px}
}
@page{size:A4;margin:11mm 12mm 11mm}
@media print{
  :root:not([data-print]),:root[data-theme]{
    --paper:#FFFFFF; --panel:#FFFFFF; --sunk:#EEF1EF; --ink:#1B2831; --ink2:#46555E; --muted:#6F7F85; --rule:#C2CBCA;

  .app{display:block;min-height:0}

  .pack{border:0;padding:0;max-width:none;font-size:9.3pt;background:var(--paper)}
  .pk-title{font-size:23pt}
  .pack h2{font-size:12.5pt;margin-top:9pt}
  .pk-t,.pk-steps li{font-size:9pt}
  .pk-t{min-width:0}
  .pk-t td.how,.pk-t td.off,.pk-steps li span:last-child{font-size:8.3pt}
  .pk-basis,.pk-dep{font-size:9pt}
  .pk-tw{overflow:visible}
  .pk-keep,.pk-t tr,.pk-faq div,.pk-steps li{break-inside:avoid}
  h2{break-after:avoid}
}

@media (max-width:1100px){
  .cols,.lab-grid,.map-wrap{grid-template-columns:minmax(0,1fr)}
  .ctrls{position:static;max-height:none}
  .cols3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:780px){
  .app{grid-template-columns:minmax(0,1fr)}

}

const SF_PER_ACRE = 43560;
function calcRLV(x){
  const land=x.area*SF_PER_ACRE, epr=x.pr*(1+x.prUp), gfa=land*epr, sal=gfa*x.eff, gdv=sal*x.asp;
  const hard=gfa*x.hc, pfee=hard*x.pf, cont=hard*x.cont;
  const stat=gdv*x.stat, sm=gdv*x.sm, fin=gdv*x.fin, demo=gdv*x.demo, prof=gdv*x.profit;
  const gdvPct=x.stat+x.sm+x.fin+x.demo+x.profit;
  const k=x.eff*(1-gdvPct);           // residual per RM of ASP per GFA sf
  const c=x.hc*(1+x.pf+x.cont);       // cost per GFA sf
  const per=x.asp*k-c;                // residual per GFA sf
  const dcr=dcRate(x), incGFA=Math.max(0,gfa-land*x.pr);
  const dc=dcr*Math.max(0,incGFA*per); // development charge on the value the incentive GFA adds
  const rlv=gdv-hard-pfee-cont-stat-sm-fin-demo-prof-dc;
  const E=epr-dcr*Math.max(0,epr-x.pr); // PR that still earns residual after the charge
  const be=c/k;                        // breakeven ASP (the charge only applies when per > 0)
  const beHC=(x.asp*k)/(1+x.pf+x.cont);// breakeven hard cost at current ASP
  return {land,epr,E,gfa,incGFA,sal,gdv,hard,pfee,cont,stat,sm,fin,demo,prof,dc,dcr,rlv,rlvAc:rlv/x.area,psf:rlv/land,k,c,per,be,beHC,
    stack:[['GDV',gdv],['Hard cost',-hard],['Professional fees',-pfee],['Contingency',-cont],['Statutory / infrastructure',-stat],['Sales & marketing',-sm],['Finance',-fin],['Demolition / relocation',-demo],['Developer profit',-prof]].concat(dc>0?[['Development charge on incentive GFA',-dc]]:[])};
}
function weightedOwnerValue(o){return o.res*(1-o.cs)+o.com*o.cs}
function ownerPackage(o){return weightedOwnerValue(o)*(1+o.up)}
function ownerBudgetPer(o){return ownerPackage(o)*(1+(o.hold||0))}
function requiredASP(x,m,n,o){const need=n*ownerBudgetPer(o)/m.land;return (need/m.E+m.c)/m.k}
function requiredPR(x,m,n,o){
  const need=n*ownerBudgetPer(o)/m.land, per=x.asp*m.k-m.c; if(per<=0) return Infinity;
  let r=need/per; const d=m.dcr||0;
  if(r>x.pr&&d>0){ if(d>=1) return Infinity; r=(r-d*x.pr)/(1-d) }
  return r;
}
function requiredHC(x,m,need){return (x.asp*m.k-need/m.E)/(1+x.pf+x.cont)}
function calcOwner(x,m){
  const o=x.owner; if(!o) return null;
  const w=weightedOwnerValue(o), pkg=ownerPackage(o), per=ownerBudgetPer(o);
  const n=o.n, reqTotal=n*per;
  return {w,pkg,per,n,reqTotal,
    maxN:m.rlv>0?m.rlv/per:0,
    coverage:m.rlv/reqTotal,
    premium:m.rlv/(n*(1+(o.hold||0)))/w-1,
    reqASP:requiredASP(x,m,n,o),
    reqPR:requiredPR(x,m,n,o),
    reqArea:m.rlvAc>0?reqTotal/m.rlvAc:Infinity,
    density:n/x.area,
    payLpsf:o.mode==='landed'?m.rlv/(x.area*SF_PER_ACRE*o.net)/((1+o.up)*(1+(o.hold||0))):null,
    maxPerAcre:m.rlvAc>0?m.rlvAc/per:0};
}
function model(x){const m=calcRLV(x);m.own=calcOwner(x,m);return m}

function evalTrigger(t){
  const s=SITE[t.site], x=st(t.site), m=model(x);
  const cur=t.cur(x,m), thr=t.thr(x,m);
  let state;
  if(cur===null||cur===undefined) state='await';
  else if(!isFinite(thr)) state='no';
  else state=(t.op==='>='?cur>=thr:t.op==='<='?cur<=thr:cur===thr)?'met':'no';
  return {cur,thr,state};
}

/* ---------- formatting ---------- */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt0(v){return isFinite(v)?Math.round(v).toLocaleString('en-MY'):'n/a'}
function fmt1(v){return isFinite(v)?v.toLocaleString('en-MY',{minimumFractionDigits:1,maximumFractionDigits:1}):'n/a'}
function fmt2(v){return isFinite(v)?v.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}):'n/a'}
function fmtRM(v){return isFinite(v)?(v<0?'−':'')+'RM'+Math.round(Math.abs(v)).toLocaleString('en-MY'):'n/a'}
function fmtM(v,d=2){return isFinite(v)?(v<0?'−':'')+'RM'+(Math.abs(v)/1e6).toFixed(d)+'m':'n/a'}
function fmtK(v){if(!isFinite(v))return 'n/a';const a=Math.abs(v);return a>=1e6?fmtM(v,2):(v<0?'−':'')+'RM'+Math.round(a/1e3).toLocaleString('en-MY')+'k'}
function fmtPct(v,d=1){return isFinite(v)?(v*100).toFixed(d)+'%':'n/a'}
function fmtSPct(v,d=1){return isFinite(v)?(v>=0?'+':'−')+Math.abs(v*100).toFixed(d)+'%':'n/a'}
function sgnCls(v){return v<0?'neg':''}

/* ---------- chart helper ---------- */
let CID=0;
function niceTicks(min,max,n=5){
  if(!isFinite(min)||!isFinite(max)) return [0,1];
  if(min===max){min-=1;max+=1}
  const raw=(max-min)/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), e=raw/mag;
  const step=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;
  const a=Math.floor(min/step)*step, b=Math.ceil(max/step)*step, t=[];
  for(let v=a;v<=b+step*1e-6;v+=step) t.push(+v.toPrecision(12));
  return t;
}
function lineChart(o){
  const W=560,H=268,P={l:60,r:18,t:18,b:42}, id='cl'+(++CID);
  const xs=o.series.flatMap(s=>s.pts.map(p=>p[0]));
  let ys=o.series.flatMap(s=>s.pts.map(p=>p[1])).filter(v=>isFinite(v));
  (o.hl||[]).forEach(h=>{if(isFinite(h.y))ys.push(h.y)});
  let xmin=o.xmin??Math.min(...xs), xmax=o.xmax??Math.max(...xs);
  let ymin=o.ymin??Math.min(...ys), ymax=Math.max(...ys);
  if(o.ymaxClip!==undefined) ymax=Math.min(ymax,o.ymaxClip);
  const yt=niceTicks(ymin,ymax); ymin=yt[0]; ymax=yt[yt.length-1];
  const xt=niceTicks(xmin,xmax,6).filter(v=>v>=xmin-1e-9&&v<=xmax+1e-9);
  const X=v=>P.l+(v-xmin)/(xmax-xmin)*(W-P.l-P.r), Y=v=>P.t+(ymax-v)/(ymax-ymin)*(H-P.t-P.b);
  let g=`<defs><clipPath id="${id}"><rect x="${P.l}" y="${P.t-2}" width="${W-P.l-P.r}" height="${H-P.t-P.b+4}"/></clipPath></defs>`;
  yt.forEach(v=>{g+=`<line class="${Math.abs(v)<1e-12?'ax0':'ax'}" x1="${P.l}" x2="${W-P.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="tick" x="${P.l-7}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${o.yf(v)}</text>`});
  xt.forEach(v=>{g+=`<text class="tick" x="${X(v).toFixed(1)}" y="${H-P.b+15}" text-anchor="middle">${o.xf(v)}</text>`});
  g+=`<text class="axl" x="${(P.l+W-P.r)/2}" y="${H-6}" text-anchor="middle">${esc(o.xl)}</text>`;
  g+=`<text class="axl" transform="translate(13 ${(P.t+H-P.b)/2}) rotate(-90)" text-anchor="middle">${esc(o.yl)}</text>`;
  g+=`<g clip-path="url(#${id})">`;
  (o.hl||[]).forEach(h=>{if(!isFinite(h.y)||h.y<ymin||h.y>ymax)return;const y=Y(h.y).toFixed(1);g+=`<line class="${h.c||'ref'}" x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}"/><text class="${h.c==='ref2'?'reflab2':'reflab'}" x="${h.left?P.l+4:W-P.r-4}" y="${(+y+(h.below?13:-5)).toFixed(1)}" text-anchor="${h.left?'start':'end'}">${esc(h.l||'')}</text>`});
  (o.vl||[]).forEach((v,i)=>{if(!isFinite(v.x)||v.x<xmin||v.x>xmax)return;const x=X(v.x).toFixed(1);g+=`<line class="${v.c||'ref'}" x1="${x}" x2="${x}" y1="${P.t}" y2="${H-P.b}"/><text class="${v.c==='ref2'?'reflab2':'reflab'}" x="${(+x+4).toFixed(1)}" y="${P.t+10+i*12}">${esc(v.l||'')}</text>`});
  o.series.forEach((s,i)=>{
    let d='',pen=false;
    s.pts.forEach(p=>{if(!isFinite(p[1])){pen=false;return}const yy=Math.max(Math.min(p[1],ymax+(ymax-ymin)),ymin-(ymax-ymin));d+=(pen?'L':'M')+X(p[0]).toFixed(1)+' '+Y(yy).toFixed(1);pen=true});
    g+=`<path class="ln c${s.c??i}" d="${d}"/>`;
  });
  (o.dots||[]).forEach(p=>{if(isFinite(p[1])&&p[1]>=ymin&&p[1]<=ymax&&p[0]>=xmin&&p[0]<=xmax)g+=`<circle class="dot" r="4.5" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}"/>`});
  g+='</g>';
  const leg=o.series.length>1?`<div class="leg">${o.series.map((s,i)=>`<span style="--c:var(--${['ink','zone','official','muted'][s.c??i]})">${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||o.xl+' vs '+o.yl)}">${g}</svg>${leg}`;
}
function range(a,b,n){const r=[];for(let i=0;i<=n;i++)r.push(a+(b-a)*i/n);return r}

      series:[.2,.3,.4].map((u,i)=>({name:`${u*100}% uplift`,c:[3,0,2][i],pts:areas.map(a=>{const mm=calcRLV({...x,area:a});return[a,Math.max(0,mm.rlv/ownerBudgetPer({...o,up:u}))]})})),
      hl:[{y:o.n,l:`${o.n} interests`}],vl:[{x:x.area,l:`Site ${fmt2(x.area)} ac`,c:'ref2'}],ymin:0,
      xl:'Site area (acres)',yl:'Max supportable interests',xf:v=>fmt2(v).replace(/\.?0+$/,''),yf:v=>fmt0(v)});
    const ns=range(10,Math.max(100,o.n*1.3),45);
    c3=lineChart({aria:'Required ASP against ownership count',
      series:[{name:'Required ASP',pts:ns.map(n=>[n,requiredASP(x,m,n,o)])}],
      hl:[{y:x.asp,l:`Current ASP ${fmtRM(x.asp)}`,c:'ref2'}],vl:[{x:o.n,l:`${o.n} interests`}],dots:[[o.n,m.own.reqASP]],
      xl:'Ownership interests',yl:'Required ASP (RM psf)',xf:v=>fmt0(v),yf:v=>fmt0(v)});
    c4=lineChart({aria:'Required plot ratio against ownership count',
      series:[{name:'Required PR',pts:ns.map(n=>[n,requiredPR(x,m,n,o)])}],
      hl:[{y:m.epr,l:`Effective PR ${fmt2(m.epr)}×`,c:'ref2'}],vl:[{x:o.n,l:`${o.n} interests`}],dots:[[o.n,m.own.reqPR]],ymin:0,ymaxClip:Math.max(12,m.epr*2.5),
      xl:'Ownership interests',yl:'Required effective PR (×)',xf:v=>fmt0(v),yf:v=>fmt1(v)});
  }
  const none='<p class="note info">Owner model not built for this site. Start one in the scenario lab to see this chart.</p>';
  return `<div class="charts">
   <div class="chart"><h3>RLV against ASP</h3><p>Dot is the current scenario. Red line is the total owner budget.</p>${c1}</div>
   <div class="chart"><h3>Supportable owners against site area</h3><p>How much land each uplift target needs.</p>${c2||none}</div>
   <div class="chart"><h3>Required ASP by ownership count</h3><p>ASP needed to pay every interest its package.</p>${c3||none}</div>
   <div class="chart"><h3>Required plot ratio by ownership count</h3><p>Density needed instead, holding ASP.</p>${c4||none}</div>
  </div>`;
}
function interestGrid(x,m){
  const o=m.own, n=Math.min(o.n,160), cov=o.coverage, paid=Math.max(0,Math.min(cov,1))*n;
  let h='';
  for(let i=0;i<n;i++){
    if(i+1<=paid+1e-9) h+='<i></i>';
    else if(i<paid) h+=`<i class="part"><b style="width:${((paid-i)*100).toFixed(0)}%"></b></i>`;
    else h+='<i class="un"></i>';
  }
  if(cov>1){const extra=Math.min(Math.floor((cov-1)*n),80);for(let i=0;i<extra;i++)h+='<i class="extra"></i>'}
  const cap = cov>=1
    ? `The residual pays all <b>${o.n}</b> interests their <b>${fmtK(o.per)}</b> package, with room for <b>${fmt1(o.maxN-o.n)}</b> more (dashed).`
    : `The residual pays <b>${fmt1(Math.max(0,o.maxN))} of ${o.n}</b> interests their <b>${fmtK(o.per)}</b> package. The hatched squares are unfunded: a <b>${fmtM(o.reqTotal-m.rlv,1)}</b> shortfall.`;
  return `<div class="igrid" role="img" aria-label="${o.n} ownership interests, ${fmt1(Math.min(o.maxN,o.n))} funded">${h}</div><p class="igrid-cap">${cap}${o.n>160?' Grid capped at 160 squares.':''}</p>`;
}

function heatTables(x,m){
  const o=x.owner;
  if(o.mode==='landed') return landedHeat(x,m);
  const shares=[.1,.25,.4,.6], ups=[.2,.25,.3,.35,.4];
  let t1=`<table class="heat"><thead><tr><th>Commercial share ↓ / uplift →</th>${ups.map(u=>`<th class="num">${fmtPct(u,0)}</th>`).join('')}</tr></thead><tbody>`;
  shares.forEach(cs=>{t1+=`<tr><td>${fmtPct(cs,0)}</td>`;ups.forEach(u=>{const per=ownerBudgetPer({...o,cs,up:u});const v=m.rlvAc/per;const d=o.n/x.area;const c=v>=d*1.25?'h-ok':v>=d?'h-warn':'h-bad';const cur=Math.abs(cs-o.cs)<.001&&Math.abs(u-o.up)<.001;t1+=`<td class="num ${c}${cur?' cur':''}">${fmt1(v)}</td>`});t1+='</tr>'});
  t1+='</tbody></table>';
  const areas=[.75,1,1.25,1.5,2,2.5], ns=[20,30,40,50,60,80];
  let t2=`<table class="heat"><thead><tr><th>Site acres ↓ / interests →</th>${ns.map(n=>`<th class="num">${n}</th>`).join('')}</tr></thead><tbody>`;
  areas.forEach(a=>{t2+=`<tr><td>${fmt2(a)}</td>`;ns.forEach(n=>{const rlv=m.rlvAc*a;const prem=rlv/(n*(1+(o.hold||0)))/weightedOwnerValue(o)-1;const c=prem>=o.up?'h-ok':prem>=0?'h-warn':'h-bad';t2+=`<td class="num ${c}">${fmtSPct(prem,0)}</td>`});t2+='</tr>'});
  t2+='</tbody></table>';
  return `<div class="pair">
   <div><h3>Max interests supported per acre</h3><p class="small muted">Green clears the current density (${fmt1(o.n/x.area)}/acre) by 25%; outlined cell is the current mix.</p><div class="tw">${t1}</div></div>
   <div><h3>Owner premium or discount to current value</h3><p class="small muted">Green meets the ${fmtPct(o.up,0)} uplift target; amber is positive but below it.</p><div class="tw">${t2}</div></div>
  </div>`;
}
function landedHeat(x,m){

  lps.forEach(lp=>{t+=`<tr><td>${fmtRM(lp)}</td>`;ups.forEach(u=>{const need=o.n*o.lot*lp*(1+u)*(1+(o.hold||0));const cov=m.rlv/need;const c=cov>=1.25?'h-ok':cov>=1?'h-warn':'h-bad';const cur=Math.abs(lp-o.lpsf)<.5&&Math.abs(u-o.up)<.001;t+=`<td class="num ${c}${cur?' cur':''}">${fmtPct(Math.max(0,cov),0)}</td>`});t+='</tr>'});

function bindLab(root){
  const sid=LAB.site, s=SITE[sid];
  const sel=root.querySelector('#labSel'); if(sel) sel.onchange=()=>go('#/lab/'+sel.value);
  const out=root.querySelector('#labOut');
  const refresh=()=>{const x=st(sid);out.innerHTML=labOutputs(s,x);bindLabOut()};
  const bindLabOut=()=>{const b=out.querySelector('#startOwner');if(b)b.onclick=()=>{st(sid).owner={...GENERIC_OWNER};saveState();render()}};
  bindLabOut();
  let raf=0;
  root.querySelectorAll('input[type="range"]').forEach(inp=>{
    inp.oninput=()=>{
      const x=st(sid), k=inp.dataset.k, v=parseFloat(inp.value);
      setK(x,k,v); applyOwnerDerived(x);
      const nIn=root.querySelector('#c_owner_n'); if(nIn&&k!=='owner.n'){nIn.value=x.owner.n;const no=root.querySelector('#c_owner_n_o');if(no)no.textContent=fmt0(x.owner.n)}
      const c=ctrlDefs(s,x).find(c=>c.k===k), base=presetState(s,x.sc)||{}, bv=getK({...base,owner:base.owner||x.owner},k);
      const id='c_'+k.replace('.','_');
      root.querySelector('#'+id+'_o').textContent=c.f(v);
      root.querySelector('#'+id+'_b').innerHTML=Math.abs(v-bv)>1e-9?badge('EDITED','Changed from '+c.f(bv)):badge(c.src);
      cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{refresh();saveState()});
    };
  });
  const fo=root.querySelector('#formOn'); if(fo) fo.onchange=()=>{const x=st(sid);x.owner.form.on=fo.checked;applyForm(x);saveState();render()};
  root.querySelectorAll('[data-fk]').forEach(inp=>inp.oninput=()=>{
    const x=st(sid);x.owner.form[inp.dataset.fk]=parseInt(inp.value,10);applyForm(x);
    root.querySelector('#f_'+inp.dataset.fk+'_o').textContent=inp.value;
    const nIn=root.querySelector('#c_owner_n'),cIn=root.querySelector('#c_owner_cs');
    if(nIn){nIn.value=x.owner.n;root.querySelector('#c_owner_n_o').textContent=fmt0(x.owner.n)}
    if(cIn){cIn.value=x.owner.cs;root.querySelector('#c_owner_cs_o').textContent=fmtPct(x.owner.cs,0)}
    cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{refresh();saveState()});
  });
  root.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{STATE[sid]=presetState(s,b.dataset.preset);saveState();render();toast(PRESET[b.dataset.preset].l+' preset applied')});
  const nc=root.querySelector('#nConf'); if(nc) nc.onchange=()=>{st(sid).owner.nConfirmed=nc.checked;saveState();render()};
  const ac=root.querySelector('#aConf'); if(ac) ac.onchange=()=>{st(sid).areaConfirmed=ac.checked;saveState();render()};
  const bindSaved=()=>{
    root.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const v=store.get('saved',[])[+b.dataset.load];STATE[v.site]=JSON.parse(JSON.stringify(v.state));saveState();go('#/lab/'+v.site);render();toast('Scenario loaded')});
    root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const sv=store.get('saved',[]);sv.splice(+b.dataset.del,1);store.set('saved',sv);root.querySelector('#savedBox').innerHTML=savedList();bindSaved()});
  };
  bindSaved();
  root.querySelector('#saveSc').onclick=()=>{
    const x=st(sid), m=model(x), sv=store.get('saved',[]);
    const name=`${s.name.replace(/^(Flat|Apartmen|Perumahan) /,'')}: ${fmtRM(x.asp)}, PR ${fmt2(x.pr*(1+x.prUp))}${x.owner?`, ${x.owner.n} interests`:''}`;
    sv.unshift({name,site:sid,date:new Date().toLocaleString('en-MY',{dateStyle:'medium',timeStyle:'short'}),state:JSON.parse(JSON.stringify(x)),rlv:m.rlv,maxN:m.own?m.own.maxN:null,n:x.owner?x.owner.n:null});
    store.set('saved',sv.slice(0,30));root.querySelector('#savedBox').innerHTML=savedList();bindSaved();toast('Scenario saved');
  };
}

function triggerTable(list,compact){
  const lab={met:['Met','ok'],no:['Not met','bad'],await:['Awaiting data','na']};
  return `<div class="tw"><table><thead><tr>${compact?'':'<th>Site</th>'}<th>Condition</th><th class="num">Current</th><th class="num">Threshold</th><th>Status</th><th>Basis</th></tr></thead><tbody>
  ${list.map(t=>{const r=evalTrigger(t),L=lab[r.state];return `<tr>${compact?'':`<td>${siteLink(SITE[t.site])}</td>`}<td>${esc(t.l)}${t.note?`<br><span class="small muted">${esc(t.note)}</span>`:''}</td>
   <td class="num">${r.cur===null||r.cur===undefined?'<span class="muted">–</span>':t.f(r.cur)+' '+t.u}</td>
   <td class="num">${isFinite(r.thr)?t.f(r.thr)+' '+t.u:'unreachable'}</td>
   <td><span class="chip ${L[1]}">${L[0]}</span></td>
   <td class="small">${r.state==='await'?'Needs: '+esc(t.need||'data'):t.basis==='scenario'?'Current scenario value':t.basis==='evidence'?'Observed evidence':'Confirmed input'}</td></tr>`}).join('')}

hard = GFA × hard cost
RLV = GDV − hard × (1 + fees + contingency)

breakeven ASP = hard cost × (1 + fees + contingency)

/* ---------- deal engine (pure) ---------- */
function dealCalc(x,m,d,nOv){
  const o={...x.owner}; if(nOv!==undefined) o.n=nOv;
  const n=o.n, Nc=n*o.cs, Nr=n-Nc, h=1+(o.hold||0);
  const w=weightedOwnerValue(o), tot=n*w;
  const pkR=o.res*(1+o.up)*h, pkC=o.com*(1+o.up)*h, paid=Nr*pkR+Nc*pkC;
  const rentG=d.T*12*(Nr*d.resRent+Nc*d.comRent), credit=Math.min(rentG,d.reloc*m.demo), rent=rentG-credit;
  const disc=Math.pow(1+d.r,d.T), asp=x.asp;
  const fee=(consid)=>d.feeBasis==='gdv'?d.feeRate*m.gdv:d.feeRate*consid;
  const fin=(S)=>{S.fee=fee(S.consid);S.after=S.surplus-S.fee;S.fundable=S.after>=0;S.prom=Math.max(0,S.after)*d.promote;S.payoff=S.fundable?S.fee+S.prom:0;S.margin=(x.profit*m.gdv+S.surplus)/m.gdv;return S};
  // A: cash buyout today
  const A=fin({key:'A',consid:paid,surplus:m.rlv-paid,upfront:paid,perR:pkR,perC:pkC,upR:pkR/o.res-1,upC:o.com?pkC/o.com-1:null,maxUp:m.rlv/(tot*h)-1,rent:0});
  A.pvR=A.upR; A.pvC=A.upC;
  // B: replacement units at completion
  const mult=d.matchPV?disc:1;
  const aR=d.sizing==='value'?pkR*mult/asp:d.oldRes*d.ratio;
  const aC=d.sizing==='value'?(o.com?pkC*mult/asp:0):d.oldCom*d.ratio;
  const R=Nr*aR+Nc*aC, VR=R*asp;
  const B=fin({key:'B',aR,aC,R,VR,fits:R<=m.sal,consid:VR,surplus:m.rlv-VR+x.sm*VR+(d.waive?x.profit*VR:0)-rent,upfront:0,rent,
    perR:aR*asp,perC:aC*asp,maxUp:(m.rlv-rent)/(tot*h*(1-x.sm-(d.waive?x.profit:0)))-1});
  B.upR=B.perR/o.res-1; B.upC=o.com?B.perC/o.com-1:null; B.pvR=B.perR/disc/o.res-1; B.pvC=o.com?B.perC/disc/o.com-1:null;
  B.ratioR=aR/d.oldRes; B.ratioC=aC/d.oldCom;
  // C: JV landowner entitlement (% of GDV) at completion
  const eReq=paid/m.gdv, e=(d.e===null||d.e===undefined)?eReq:d.e, pay=e*m.gdv;
  const C=fin({key:'C',eReq,e,eMax:(m.rlv-rent)/m.gdv,consid:pay,surplus:m.rlv-pay-rent,upfront:0,rent,
    perR:pay*o.res/tot,perC:pay*o.com/tot,maxUp:(m.rlv-rent)/tot-1});
  C.upR=pay/tot-1; C.upC=o.com?C.upR:null; C.pvR=(1+C.upR)/disc-1; C.pvC=o.com?C.pvR:null;
  return {A,B,C,rent,rentG,credit,disc,n,Nr,Nc,pkR,pkC,paid};
}
function maxInterests(x,m,d,key){
  let best=0;
  for(let n=1;n<=300;n++){const r=dealCalc(x,m,{...d,e:null},n)[key];if(r.after>=0)best=n;else if(n>best+25)break}
  return best;
}

/* ---------- assembly tracker ---------- */
const ASM_ST=[['Not contacted','u'],['Contacted','c'],['Interested','i'],['Signed','s'],['Refused','r']];
let ASM=store.get('asm',{});
function asm(id,n){
  if(!ASM[id]) ASM[id]={items:[],sel:0};
  const a=ASM[id]; while(a.items.length<n) a.items.push({s:0,l:''});
  return a;
}

/* ---------- building form (bays x levels) ---------- */
function applyOwnerDerived(x){
  if(!x||!x.owner) return;
  const o=x.owner;
  if(o.mode==='landed'){o.n=Math.max(1,Math.round(x.area*SF_PER_ACRE*o.net/o.lot));o.res=o.lot*o.lpsf;o.cs=0;o.com=0;return}
  applyForm(x);
}
function applyForm(x){
  const f=x.owner&&x.owner.form; if(!f||!f.on) return;
  x.owner.n=Math.round(f.bays*f.levels);
  x.owner.cs=f.levels>0?1/f.levels:0;
}

function bindDeal(root){
  const sid=DSEL, s=SITE[sid];
  const sel=root.querySelector('#dealSel'); if(sel) sel.onchange=()=>go('#/deal/'+sel.value);
  const out=root.querySelector('#dealOut'); let raf=0;
  const refresh=()=>{out.innerHTML=dealOutputs(s,st(sid),dl(sid))};
  root.querySelectorAll('[data-dk]').forEach(inp=>inp.oninput=()=>{
    const d=dl(sid), k=inp.dataset.dk, v=parseFloat(inp.value); d[k]=v;
    const o=root.querySelector('#d_'+k+'_o');
    if(o) o.textContent = k==='e'?fmtPct(v,1):k==='T'?fmt1(v)+' yrs':k==='r'?fmtPct(v,1):/Rent$/.test(k)?fmtRM(v):/^old/.test(k)?fmt0(v)+' sf':k==='feeRate'?fmtPct(v,2):fmtPct(v,0);
    cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{refresh();store.set('deal',DEAL)});
  });
  root.querySelectorAll('[data-dsz]').forEach(b=>b.onclick=()=>{dl(sid).sizing=b.dataset.dsz;store.set('deal',DEAL);render()});
  root.querySelectorAll('[data-fb]').forEach(b=>b.onclick=()=>{const d=dl(sid);d.feeBasis=b.dataset.fb;d.feeRate=b.dataset.fb==='gdv'?.005:.02;store.set('deal',DEAL);render()});
  const pv=root.querySelector('#dPV'); if(pv) pv.onchange=()=>{dl(sid).matchPV=pv.checked;store.set('deal',DEAL);refresh()};
  root.querySelector('#dWaive').onchange=e=>{dl(sid).waive=e.target.checked;store.set('deal',DEAL);refresh()};
  root.querySelector('#eReset').onclick=()=>{dl(sid).e=null;store.set('deal',DEAL);render()};
  root.querySelector('#dReset').onclick=()=>{delete DEAL[sid];dl(sid);store.set('deal',DEAL);render();toast('Deal assumptions reset')};
}

const SYNC_KEYS=['state','saved','checks','v2w','deal','asm','cal','glob','inc','mc'];
const SYNC={mode:'local',doc:null,pushing:false,dirty:false,t:0,lastPushed:null};
function syncLabel(){
  const el=document.getElementById('syncState'); if(!el) return;
  el.textContent={local:'Saved in this browser only',connecting:'Connecting to your account…',synced:'Saved privately to your account',saving:'Saving to your account…',readonly:'View only: changes stay in this browser'}[SYNC.mode];
  el.dataset.mode=SYNC.mode;
}
function setSync(m){SYNC.mode=m;syncLabel()}
function workspaceBody(){
  return {v:2,updatedAt:store.get('updatedAt',new Date().toISOString()),
    state:STATE,saved:store.get('saved',[]),checks:CHECKS,v2w:V2W,deal:DEAL,asm:ASM,cal:CAL,glob:GLOB,inc:INC,mc:MC};
}
function schedulePush(){
  try{localStorage.setItem('klure:updatedAt',JSON.stringify(new Date().toISOString()))}catch(e){}
  if(!SYNC.doc) return;
  clearTimeout(SYNC.t); SYNC.t=setTimeout(pushNow,900);
}
async function pushNow(){
  if(!SYNC.doc||SYNC.mode==='readonly') return;
  if(SYNC.pushing){SYNC.dirty=true;return}
  SYNC.pushing=true; setSync('saving');
  const body=JSON.parse(JSON.stringify(workspaceBody())); SYNC.lastPushed=body.updatedAt;
  try{await SYNC.doc.set(body); setSync('synced')}
  catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await SYNC.doc.set(body);setSync('synced')}catch(e2){setSync('local')}}
    else if(e&&(e.code==='invalid_argument'||e.code==='not_granted')) setSync('readonly');
    else if(e&&e.code==='quota_exceeded'){setSync('local');toast('Account storage is full; changes stay in this browser')}
    else setSync('local');
  }
  finally{SYNC.pushing=false; if(SYNC.dirty){SYNC.dirty=false;pushNow()}}
}
function applyRemote(b){
  if(!b||typeof b!=='object') return;
  const raw=(k,v)=>{try{localStorage.setItem('klure:'+k,JSON.stringify(v))}catch(e){}};
  if(b.state){STATE=JSON.parse(JSON.stringify(b.state));raw('state',STATE)}
  if(b.saved){raw('saved',b.saved)}
  if(b.checks){CHECKS=JSON.parse(JSON.stringify(b.checks));raw('checks',CHECKS)}
  if(b.v2w){V2W=JSON.parse(JSON.stringify(b.v2w));raw('v2w',V2W)}
  if(b.deal){DEAL=JSON.parse(JSON.stringify(b.deal));raw('deal',DEAL)}
  if(b.asm){ASM=JSON.parse(JSON.stringify(b.asm));raw('asm',ASM)}
  if(b.cal){CAL=JSON.parse(JSON.stringify(b.cal));raw('cal',CAL)}
  if(b.glob){GLOB=JSON.parse(JSON.stringify(b.glob));raw('glob',GLOB)}
  if(b.inc){INC=JSON.parse(JSON.stringify(b.inc));raw('inc',INC)}
  if(b.mc&&typeof b.mc==='object'){MC=JSON.parse(JSON.stringify(b.mc));raw('mc',MC)}
  if(b.updatedAt) raw('updatedAt',b.updatedAt);
  const a=document.activeElement; if(a&&a.type==='range') return; // don't yank a slider mid-drag
  render();
}
async function initSync(){
  if(!(window.claude&&typeof window.claude.use==='function')){setSync('local');return}
  setSync('connecting');
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){setSync('local');return}
    const uid=await user.id(); if(!uid){setSync('local');return}
    const doc=db.doc('data/users/'+uid+'/workspace');
    const snap=await doc.get();
    SYNC.doc=doc;
    const localAt=store.get('updatedAt',null);
    if(snap.exists){
      const b=snap.data();
      if(localAt&&b.updatedAt&&localAt>b.updatedAt) await pushNow(); else applyRemote(b);
    } else await pushNow();
    if(SYNC.mode!=='readonly') setSync('synced');
    doc.onSnapshot(sn=>{
      if(!sn.exists||sn.metadata.hasPendingWrites) return;
      const b=sn.data(); if(!b||b.updatedAt===SYNC.lastPushed) return;
      const la=store.get('updatedAt',null); if(la&&b.updatedAt&&b.updatedAt<=la) return;
      applyRemote(b);
    },()=>setSync('local'));
  }catch(e){setSync('local')}
}

/* ---------- distance to deal ---------- */
function levers(s){return s.rlv?leversFor(s,st(s.id)):null}
function leversFor(s,x){
  if(!s.rlv||!x) return null;
  const m=model(x), L={s,x,m,items:[]};
  if(m.own){
    const need=m.own.reqTotal/m.land, hcStar=requiredHC(x,m,need);
    L.mode='owner'; L.cov=m.own.coverage; L.clears=m.own.coverage>=1;
    L.items.push({k:'asp',l:'ASP',v:m.own.reqASP/x.asp-1,target:m.own.reqASP,f:fmtRM,u:' psf'});
    L.items.push({k:'hc',l:'Hard cost',v:hcStar>0?hcStar/x.hc-1:-1,target:hcStar,f:fmtRM,u:' psf GFA',floor:hcStar<=0});
    L.items.push({k:'pkg',l:'Owner package',v:Math.max(-1,m.own.coverage-1),target:m.own.per*Math.max(0,m.own.coverage),f:fmtK,u:' each',floor:m.rlv<=0});
    L.prNeed=m.own.reqPR; L.prUp=isFinite(L.prNeed)?L.prNeed/x.pr-1:Infinity;
  } else {
    L.mode='rlv'; L.clears=m.rlv>0; L.cov=null;
    L.items.push({k:'asp',l:'ASP',v:m.be/x.asp-1,target:m.be,f:fmtRM,u:' psf'});
    L.items.push({k:'hc',l:'Hard cost',v:m.beHC/x.hc-1,target:m.beHC,f:fmtRM,u:' psf GFA'});
    L.prNeed=null; L.prUp=null;
  }
  const valid=L.items.filter(i=>!i.floor&&isFinite(i.v));
  L.nearest=valid.slice().sort((a,b)=>Math.abs(a.v)-Math.abs(b.v))[0]||null;
  return L;
}
function leverText(L){
  if(!L||!L.nearest) return '–';
  const n=L.nearest, nl=n.l==='ASP'?'ASP':n.l.toLowerCase();
  if(L.mode==='rlv') return L.clears?`Residual positive (${nl} headroom ${fmtPct(Math.abs(n.v),1)}); owner model missing`:`${n.l} ${fmtSPct(n.v)} to break even`;
  if(L.clears) return `Clears; thinnest headroom ${fmtPct(Math.abs(n.v),1)} on ${nl}`;
  return `${n.l} ${fmtSPct(n.v)}`;
}
function prBand(up,s){
  if(up===null) return null;
  if(!isFinite(up)) return ['Density can’t help','bad','Each added floor loses money at this ASP'];
  if(up<=0) return ['Base PR enough','ok','No incentive needed'];
  const b=s?incB(s.id):null, asRead=b?b.share:0, mx=s?incMax(s.id):null;
  if(b&&up<=asRead+1e-9) return ['Within the guideline','ok',`DBKL 2026, ${incTag(s.id)}: +${fmtPct(asRead,0)} for this site`];
  if(mx&&up<=mx.share+1e-9) return ['Needs more components','warn',`Above the +${fmtPct(asRead,0)} ${incTag(s.id)}; reachable up to +${fmtPct(mx.share,0)} with open space and a transit zone`];
  if(mx&&up<=G26.cap+1e-9) return ['Beyond this classification','bad',`More than the +${fmtPct(mx.share,0)} this classification can reach; the 70% cap needs a higher redevelopment tier`];
  if(!mx&&up<=G26.cap+1e-9) return ['Needs an incentive','warn','Within DBKL’s 70% cap'];
  return ['Beyond the 70% cap','bad','More than DBKL’s 2026 guideline allows on plot ratio'];
}

function tierSection(pshares){
  const sub=GDVCOMPS.filter(g=>g.tier==='sub').map(gShare), sLo=Math.min(...sub), sHi=Math.max(...sub);
  const lo=Math.min(...pshares), hi=Math.max(...pshares);
  const rows=SITES.filter(s=>s.rlv).map(s=>{const x=st(s.id),m=model(x);return {s,x,m,share:m.rlv/m.gdv}});
  const tp=rows.find(r=>r.s.id==='taiping');
  const body=rows.map(r=>{
    const tier=SITE_TIER[r.s.id]==='prime', a=tier?lo:sLo, z=tier?hi:sHi, bLo=r.m.gdv*a, bHi=r.m.gdv*z, gap=a-r.share;
    return `<tr><td>${siteLink(r.s)}</td><td>${tier?'Prime fringe':'Suburban'}</td><td class="num ${sgnCls(r.share)}">${fmtPct(r.share)}</td>
     <td class="num">${fmtPct(a)}–${fmtPct(z)}</td><td class="num ${gap>0?'neg':''}">${gap>0?fmtPct(gap)+' below':'Within or above'}</td>
     <td class="num">${fmtM(bLo,1)} to ${fmtM(bHi,1)}</td>
     <td class="num">${r.m.own?`${fmt1(bLo/r.m.own.per)} to ${fmt1(bHi/r.m.own.per)}`:'<span class="muted">–</span>'}</td></tr>`;
  }).join('');
  return `<div class="sec"><div class="sec-head"><h2>Land share of GDV by market tier</h2><span class="muted">Model residual against what developers actually pay</span></div>
   <div class="tw"><table class="cost"><thead><tr><th>Site</th><th>Tier</th><th class="num">Model RLV ÷ GDV</th><th class="num">Market band</th><th class="num">Model versus band</th><th class="num">Land budget at band</th><th class="num">Interests that budget pays</th></tr></thead><tbody>${body}</tbody></table></div>
   <p class="small muted" style="margin-top:8px">At base PR, every suburban site models below the 10–12% of GDV that developers pay. That is the density gap again: market land prices assume more floor area than the base plot ratio allows. Deals: ${GDVCOMPS.map(g=>`<a href="${g.url}" target="_blank" rel="noopener">${esc(g.name)}</a> ${fmtPct(gShare(g))}`).join('; ')}.</p>
   ${tp&&tp.m.own?`<p class="note small">Taiping’s model land share is ${fmtPct(tp.share)}. Underwritten like the prime KL buyers, its land budget would be ${fmtM(tp.m.gdv*lo,1)}–${fmtM(tp.m.gdv*hi,1)}, enough for ${fmt1(tp.m.gdv*lo/tp.m.own.per)}–${fmt1(tp.m.gdv*hi/tp.m.own.per)} interests at the current package. Those deals are city-centre plots at PR 8–10, so treat this as an upper bound, not a base case.</p>`:''}
  </div>`;
}

}

function importWorkspace(text){
  let j; try{j=JSON.parse(text)}catch(e){toast('That is not valid JSON');return false}
  const b=j&&typeof j==='object'?(j.workspace||j):null;
  const keys=['state','saved','checks','v2w','deal','asm','cal','glob','inc','mc'];
  if(!b||typeof b!=='object'||!keys.some(k=>b[k]&&typeof b[k]==='object')){toast('No workspace data found in that file');return false}
  if(b.state&&typeof b.state==='object'){
    const clean={};
    for(const id in b.state){
      const s=SITE[id], v=b.state[id];
      if(!s||!s.rlv||!v||typeof v!=='object') continue;
      const base=presetState(s,'base');
      const merged={...base,...v};
      merged.owner=v.owner&&typeof v.owner==='object'?{...(base.owner||{}),...v.owner}:base.owner;
      for(const kk of ['area','asp','pr','prUp','eff','hc','pf','cont','stat','sm','fin','demo','profit']) if(!isFinite(merged[kk])) merged[kk]=base[kk];
      applyOwnerDerived(merged); clean[id]=merged;
    }
    b.state=clean;
  }
  b.updatedAt=new Date().toISOString();
  applyRemote(b); schedulePush(); toast('Workspace imported'); return true;
}

/* ---------- DBKL 2026 guideline: models ---------- */
function covCls(v){return v===null||v===undefined||!isFinite(v)?'na':v>=1?'ok':v>=.8?'warn':'bad'}
function modelB(id,share,dc){const x=JSON.parse(JSON.stringify(st(id)));x.prUp=share;if(dc!==undefined)x.dc=dc;applyOwnerDerived(x);return model(x)}
function catA(id,k,ov){
  const x=st(id), d=incP(id), c=G26.catA.find(z=>z.k===k); if(!x||!d||!c) return null;
  const p={...d,...(ov||{})}, land=x.area*SF_PER_ACRE, o=x.owner;
  const U=Math.max(0,Math.floor(c.ose*x.area/p.ppu+1e-9)), G=o?Math.min(o.n,U):0;
  const need=Math.max(0,Math.ceil(c.ctl*U-1e-9)), aff=Math.max(0,need-G), big=x.area>=G26.bigAcres||!!p.big, ms=big?G26.mBig:G26.mSmall;
  const M=Math.round(aff*ms), R=aff-M, F=Math.max(0,U-G-aff);
  const sF=p.unitSf, mkt=(F+G)*sF, affNfa=M*AFF.madani.sf+R*AFF.rmm.sf, nfa=mkt+affNfa, gfa=nfa/x.eff, epr=gfa/land;
  const gdvAff=M*AFF.madani.p+R*AFF.rmm.p, gdv=mkt*x.asp+gdvAff;
  const gp=x.stat+x.sm+x.fin+x.demo+x.profit, cc=x.hc*(1+x.pf+x.cont), per=x.asp*x.eff*(1-gp)-cc;
  const dcr=dcRate(x), dc=dcr*Math.max(0,gfa-land*x.pr)*(nfa>0?F*sF/nfa:0)*Math.max(0,per);
  const rlv=gdv-gfa*cc-gdv*gp-dc, budget=o?o.n*ownerBudgetPer(o):null;
  return {k,ctl:c.ctl,ose:c.ose,p,U,G,need,aff,big,ms,M,R,F,mkt,affNfa,nfa,gfa,epr,gdv,gdvAff,affLoss:affNfa*x.asp-gdvAff,dc,rlv,rlvAc:rlv/x.area,
    budget,cov:budget?rlv/budget:null,per:o?ownerBudgetPer(o):null,ctlActual:U>0?(G+aff)/U:0,unhoused:o?Math.max(0,o.n-U):0};
}
function catAAll(id){const all=G26.catA.map(c=>catA(id,c.k)).filter(Boolean);if(!all.length)return null;return {all,best:all.reduce((a,q)=>q.rlv>a.rlv?q:a)}}
function g26Row(id,withA){
  const s=SITE[id]; if(!s||!s.rlv) return null; const b=incB(id); if(!b) return null;
  const x=st(id), mx=incMax(id); return {s,x,b,mx,m0:model(x),mb:modelB(id,b.share),mc:modelB(id,mx.share),A:withA?catAAll(id):null};
}
function hav(a,b,c,d){const r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r,q=Math.sin(dl/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)**2;return 2*6371*Math.asin(Math.sqrt(q))}
function nearestStation(s){let best=null;RAIL.forEach(r=>r.st.forEach(p=>{const km=hav(s.lat,s.lon,p[1],p[2]);if(!best||km<best.km)best={n:p[0],line:r.n,km}}));return best}
function tpzRead(km){return km<=.4?['Possible TPZ','ok','inside a possible TPZ']:km<=.6?['Possible TIZ','warn','inside a possible TIZ']:km<=.7?['Near the TIZ edge','warn','just outside the TIZ']:['Outside transit zones','na','outside both zones']}

 'Eligibility is judged on the buildings standing at application, with a five-year lookback on records DBKL can verify (6.0(3)).',

function g26CovCell(m,sub){return `<td class="num">${m.own?`<span class="chip ${covCls(m.own.coverage)}">${fmtPct(Math.max(0,m.own.coverage),0)} covered</span>`:`<span class="${sgnCls(m.rlv)}">${fmtM(m.rlvAc)}/acre</span>`}<span class="small muted" style="display:block">${sub}</span></td>`}
function g26Section(){
  const rows=SITES.filter(s=>s.rlv&&INC_DEFAULT[s.id]).map(s=>g26Row(s.id,true)).filter(Boolean);

    else if(g.mb.own){const c=aBetter?A.cov:g.mb.own.coverage;lab=`<span class="chip ${c>=1?'ok':'warn'}">${route} ${c>=1?'clears':'still short'}</span>`}
    else lab=`<span class="chip na">${route}; owners untested</span>`;

      <td class="num">${fmt2(s.pr)}×</td>
      ${g26CovCell(g.mb,`PR ${fmt2(g.b.pr)} (+${fmtPct(g.b.share,0)})`)}
      ${g26CovCell(g.mc,`PR ${fmt2(g.mx.pr)} (+${fmtPct(g.mx.share,0)})`)}
      <td class="num">${A?(A.cov!==null?`<span class="chip ${covCls(A.cov)}">${fmtPct(Math.max(0,A.cov),0)} covered</span>`:`<span class="${sgnCls(A.rlv)}">${fmtM(A.rlvAc)}/acre</span>`)+`<span class="small muted" style="display:block">Tier ${A.k}, PR ${fmt2(A.epr)} equivalent</span>`:'<span class="muted">–</span>'}</td>
      <td>${lab}</td></tr>`;

  return `<div class="sec"><div class="sec-head"><h2>DBKL 2026 incentive guideline</h2><span class="muted">What each route could add on each site’s current scenario</span></div>
   <div class="tw"><table class="cost"><thead><tr><th>Site</th><th>Category B classification</th><th class="num">Base PR</th><th class="num">Category B</th><th class="num">Most it could reach</th><th class="num">Category A, best tier</th><th>Better route</th></tr></thead><tbody>${body}</tbody></table></div>

  </div>`;
}

function bindIncentive(root){
  const sid=ISEL, d=incP(sid);
  const commit=(focusSel)=>{store.set('inc',INC);render();if(focusSel){const f=document.querySelector(focusSel);if(f)f.focus({preventScroll:true})}};
  const sel=root.querySelector('#incSel'); if(sel) sel.onchange=()=>go('#/incentive/'+sel.value);
  root.querySelectorAll('[data-ir]').forEach(b=>b.onclick=()=>{d.redev=parseFloat(b.dataset.ir);commit(`[data-ir="${b.dataset.ir}"]`)});
  root.querySelectorAll('[data-ie]').forEach(b=>b.onclick=()=>{d.elig=parseFloat(b.dataset.ie);commit(`[data-ie="${b.dataset.ie}"]`)});
  const r=root.querySelector('#i_res'); if(r) r.onchange=()=>{d.residing=r.checked?G26.residing:0;commit('#i_res')};
  const bg=root.querySelector('#i_big'); if(bg) bg.onchange=()=>{d.big=bg.checked;commit('#i_big')};
  for(const id in INC_SL){const el=root.querySelector('#'+id); if(!el) continue; const [k,f]=INC_SL[id];
    el.oninput=()=>{root.querySelector('#'+id+'_o').textContent=f(parseFloat(el.value))};
    el.onchange=()=>{d[k]=parseFloat(el.value);commit('#'+id)}}
  root.querySelector('#iApply').onclick=()=>{const b=incB(sid),x=st(sid);x.prUp=b.share;x.sc='g26';saveState();toast(`PR uplift set to +${fmtPct(b.share,0)} in the lab`);go('#/lab/'+sid)};
  armConfirm(root.querySelector('#iReset'),()=>{delete INC[sid];store.set('inc',INC);render();toast('Reset to our reading of the guideline')});
}

   run time: the site's base preset (not lab edits), the default deal assumptions and, for the DBKL 2026
   scenario, the guideline share as read (not as set in DBKL incentives). Payment figures appear only when
   the scenario pays every owner in full, and each payment option only when the project can fund it. */
const PACK_LANGS=[['en','English','en'],['ms','Bahasa Malaysia','ms'],['zh','简体中文','zh-Hans']];

function packSites(){return MODELLED.filter(i=>SITE[i].owner)}
function packAsRead(id){return incB(id,incDefault(id))}
function packMaxRead(id){return incB(id,{...incDefault(id),residing:G26.residing,open:G26.openMax,tpz:G26.tpzMax})}
function packState(id,sc){
  const s=SITE[id]; if(!s||!s.owner) return null;
  const x=presetState(s,'base');
  if(sc==='g26'){x.sc='g26';x.prUp=packAsRead(id).share}
  return x;
}
function packBand(id,up){
  if(up===null||!isFinite(up)) return 'none';
  if(up<=1e-9) return 'base';
  const a=packAsRead(id), mx=packMaxRead(id);
  if(a&&up<=a.share+1e-9) return 'guide';
  if(mx&&up<=mx.share+1e-9) return 'more';
  if(up<=G26.cap+1e-9) return 'class';
  return 'cap';
}
function packData(id,sc){
  const s=SITE[id], x=packState(id,sc); if(!x) return null;
  const m=model(x), d={...DEAL_DEFAULT,...(DEAL_SITE[id]||{})}, D=dealCalc(x,m,d), o=x.owner;
  const ok={A:D.A.surplus>=0,B:D.B.surplus>=0&&D.B.fits,C:D.C.surplus>=0};
  return {s,x,m,d,D,o,sc,landed:o.mode==='landed',ready:m.own.coverage>=1,ok,g:sc==='g26'?packAsRead(id):null,L:leversFor(s,x)};
}

/* formats a figure the way the pack prints it; tests re-check every [data-fig] against the engine */
const PK_F={rm:fmtRM,pct:v=>fmtPct(v,0),pct1:v=>fmtPct(v,1),spct:v=>(v>=0?'+':'−')+Math.abs(v*100).toFixed(0)+'%',sf:fmt0,x2:fmt2,int:fmt0,yrs:v=>Number.isInteger(v)?String(v):fmt1(v)};
function packHTML(id,lang,sc){
  const P=packData(id,sc), T=PK[lang]||PK.en; if(!P) return '';
  const {s,x,m,d,D,o,landed,ready,ok,g,L}=P, hl=(PACK_LANGS.find(l=>l[0]===lang)||PACK_LANGS[0])[2];
  const tag=src=>{const t=SRC[src]||SRC.INFERRED;return `<span class="src ${t.t==='edit'?'edit':'t'+t.t}">${esc(T.src[src]||t.l)}</span>`};
  const fig=(k,v,f,src,kind='pay',noTag)=>`<span class="pk-fig" data-fig="${k}" data-kind="${kind}" data-v="${v}" data-f="${f}" data-src="${src}">${PK_F[f](v)}</span>${noTag?'':tag(src)}`;
  const n=(/Specific Site (\d+)/.exec(s.ref||'')||[])[1]||'';
  const dc=dcRate(x), y=fig('years',d.T,'yrs','UNDERWRITING_ASSUMPTION','info',true);
  const epr=m.epr;
  const basis=sc==='g26'?T.basisG26(fig('basePR',x.pr,'x2',s.prType,'info',true),fig('share',x.prUp,'pct','INFERRED','info',true),fig('effPR',epr,'x2','MODEL_OUTPUT','info',true)):T.basisBase(fig('basePR',x.pr,'x2',s.prType,'info',true));
  const nr=o.n*(1-o.cs), nc=o.n*o.cs;
  const assume=landed?T.assumeL(fig('lot',o.lot,'sf',(s.ownerSrc||{}).lot||'INFERRED','info',true),fig('lpsf',o.lpsf,'rm',(s.ownerSrc||{}).lpsf||'INFERRED','info',true),((s.ownerSrc||{}).lpsf)==='ASKING_LISTING')
    :T.assumeS(fig('n',o.n,'int','UNDERWRITING_ASSUMPTION','info',true),fmt0(nr),fmt0(nc));
  let pay='';
  if(ready){
    const groups=landed?[{k:'R',h:T.grpL(fmt0(o.lot)),today:o.res,todaySrc:(s.ownerSrc||{}).lpsf||'INFERRED',home:d.oldRes,homeSrc:'UNDERWRITING_ASSUMPTION',rent:d.resRent,rentSrc:'UNDERWRITING_ASSUMPTION'}]
      :[{k:'R',h:T.grpR,today:o.res,todaySrc:'TRANSACTION',home:d.oldRes,homeSrc:'ASKING_LISTING',rent:d.resRent,rentSrc:'UNDERWRITING_ASSUMPTION'}].concat(o.com&&o.cs>0?[{k:'C',h:T.grpC,today:o.com,todaySrc:'MODEL_OUTPUT',home:d.oldCom,homeSrc:'ASKING_LISTING',rent:d.comRent,rentSrc:'ASKING_LISTING'}]:[]);
    const keys=['A','B','C'], cell=(K,html)=>ok[K]?`<td>${html}</td>`:'<td class="off">–</td>';
    const how=keys.map(K=>ok[K]?`<td class="how">${K==='C'?T.how.C(fig('jvShare',D.C.e,'pct1','MODEL_OUTPUT')):T.how[K]}</td>`:`<td class="off" data-note="notoffered-${K}">${T.notOff}</td>`).join('');
    const body=groups.map(G=>{
      const R=G.k, per={A:D.A['per'+R],B:D.B['per'+R],C:D.C['per'+R]}, up={A:D.A['up'+R],B:D.B['up'+R],C:D.C['up'+R]};
      const area=R==='R'?D.B.aR:D.B.aC, ratio=R==='R'?D.B.ratioR:D.B.ratioC;
      return `<tr class="grp"><td colspan="4">${G.h} <span>· ${T.today(fig('today'+R,G.today,'rm',G.todaySrc))}</span></td></tr>
       <tr><td>${T.rows.val}</td>${keys.map(K=>cell(K,`${fig('val'+K+R,per[K],'rm','MODEL_OUTPUT')}${K==='A'?'':`<span class="pk-sub">${T.atComp}</span>`}`)).join('')}</tr>
       <tr><td>${T.rows.up}</td>${keys.map(K=>cell(K,fig('up'+K+R,up[K],'spct','MODEL_OUTPUT',undefined,true))).join('')}</tr>
       ${!ok.B?'':`<tr><td>${T.rows.home}</td><td class="off">–</td>${cell('B',T.homeTxt(fig('area'+R,area,'sf','MODEL_OUTPUT',undefined,true),fig('ratio'+R,ratio,'pct','MODEL_OUTPUT',undefined,true),fig('home'+R,G.home,'sf',G.homeSrc,undefined,true))+tag('MODEL_OUTPUT'))}<td class="off">–</td></tr>`}
       ${!ok.B&&!ok.C?'':`<tr><td>${T.rows.rent}</td><td class="off">–</td>${['B','C'].map(K=>cell(K,T.rentTxt(fig('rent'+K+R,G.rent,'rm',G.rentSrc,undefined,true),y)+tag(G.rentSrc))).join('')}</tr>`}`;
    }).join('');
    pay=`${g?`<p class="pk-dep" data-note="g26">${T.dep}</p>`:''}
     <div class="pk-tw"><table class="pk-t"><thead><tr><th></th>${keys.map((K,i)=>`<th>${i+1}. ${T.opt[K]}<small>${T.optSub[K]}</small></th>`).join('')}</tr></thead>
      <tbody><tr><td></td>${how}</tr>${body}
       <tr><td>${T.rows.when}</td>${cell('A',T.whenA)}${['B','C'].map(K=>cell(K,T.whenBC(y))).join('')}</tr></tbody></table></div>
     ${ok.B&&Math.min(D.B.ratioR,o.com?D.B.ratioC:1)<1?`<p class="small" style="margin-top:6px">${T.sizeNote}</p>`:''}`;
  } else {
    const it=[];
    if(m.per<=0){
      it.push(T.nr.neg(fig('lev_be',m.be,'rm','MODEL_OUTPUT','lever',true),fig('lev_asp',x.asp,'rm','UNDERWRITING_ASSUMPTION','lever',true)));
      it.push(T.nr.noDen);
    } else {
      const a=L.items.find(i=>i.k==='asp'), h=L.items.find(i=>i.k==='hc');
      if(a&&isFinite(a.v)) it.push(T.nr.asp(fig('lev_asp',x.asp,'rm','UNDERWRITING_ASSUMPTION','lever',true),fig('lev_aspTo',a.target,'rm','MODEL_OUTPUT','lever',true),fig('lev_aspPct',a.v,'pct1','MODEL_OUTPUT','lever',true)));
      if(h&&!h.floor&&isFinite(h.v)) it.push(T.nr.hc(fig('lev_hc',x.hc,'rm','UNDERWRITING_ASSUMPTION','lever',true),fig('lev_hcTo',h.target,'rm','MODEL_OUTPUT','lever',true),fig('lev_hcPct',-h.v,'pct1','MODEL_OUTPUT','lever',true)));
      if(isFinite(L.prNeed)) it.push(T.nr.pr(fig('lev_pr',L.prNeed,'x2','MODEL_OUTPUT','lever',true),fig('lev_prCur',epr,'x2','MODEL_OUTPUT','lever',true),T.nr.band[packBand(id,L.prUp)]));
      else it.push(T.nr.noDen);
    }
    pay=`<div class="pk-nr pk-keep" data-note="notready"><h3>${T.nr.title}</h3><p>${T.nr.body}</p><ul>${it.map(t=>`<li>${t}</li>`).join('')}</ul><p class="small" style="margin:6px 0 0">${sc==='g26'?T.nr.g26:T.nr.base}</p></div>`;
  }
  const cv=k=>PACKC[k]?esc(PACKC[k]):`<span class="ph">[${T.contact[k]}]</span>`;
  const stamp=lang!=='en'&&!PACK_REVIEWED[lang]?`<div class="pk-stamp" data-note="review">${T.review} · for native-speaker review</div>`:'';
  return `<article class="pack" lang="${hl}" data-site="${id}" data-lang="${lang}" data-sc="${sc}" data-ready="${ready}">
   <header class="pk-head"><div><div class="pk-kick">${T.kicker}</div><div class="pk-title">${esc(s.name)}</div><div class="pk-place">${esc(s.place)} · ${T.ref(n)}</div></div>
    <div class="pk-scen"><b>${T.scen[sc]}</b>${stamp?'<br>'+stamp:''}</div></header>
   <p class="pk-made">${T.made(T.date(new Date()),T.scen[sc],dc>0?fmtPct(dc,0):'')}</p>
   <section class="pk-keep"><h2>${T.h1}</h2><p>${(landed?T.p1L:T.p1S)(esc(s.name),n)}</p><p>${T.why}</p></section>
   <section><h2>${T.h2}</h2><div class="pk-basis pk-keep"><p>${basis}</p>${ready?`<p>${assume}</p>`:''}</div>${pay}</section>
   <section class="pk-keep"><h2>${T.rights.h}</h2><div class="pk-cols"><ul class="pk-rights">${T.rights.items.map(t=>`<li>${t}</li>`).join('')}</ul>
    <div><h3 style="margin-top:0">${T.steps.h}</h3><ol class="pk-steps">${T.steps.list(y).map(([a,b])=>`<li><span>${a}</span><span>${b}</span></li>`).join('')}</ol><p class="small muted" style="margin:0">${T.steps.note}</p></div></div></section>
   <section><h2>${T.faq.h}</h2><dl class="pk-faq">${T.faq.list.map(([q,a])=>`<div><dt>${q}</dt><dd>${a}</dd></div>`).join('')}</dl></section>
   <section class="pk-keep"><h2>${T.contact.h}</h2><div class="pk-contactbox">${['name','phone','email','meet'].map(k=>`<div>${cv(k)}</div>`).join('')}</div></section>
   <footer class="pk-disc pk-keep"><b>${T.disc.h}</b> ${T.disc.body}<div class="pk-legend">${T.legend}</div></footer>
  </article>`;
}
function viewPack(id,lang,sc){

     <div class="row">${['name','phone','email','meet'].map(k=>`<label>${PK.en.contact[k]}<input type="text" data-pc="${k}" value="${esc(PACKC[k]||'')}" autocomplete="off"></label>`).join('')}</div>
     <p class="small muted" style="margin:6px 0 0">Your own contact details only, saved in this browser. Never put owners’ names or contact details in a pack. <code>npm run packs</code> exports every site, language and scenario to PDF.</p>

function bindPack(root){
  const sel=root.querySelector('#packSel'); if(sel) sel.onchange=()=>go(`#/pack/${sel.value}/${PLANG}/${PSC}`);
  root.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>go(`#/pack/${PSEL}/${b.dataset.pl}/${PSC}`));
  root.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>go(`#/pack/${PSEL}/${PLANG}/${b.dataset.ps}`));
  root.querySelector('#packPrint').onclick=()=>window.print();
  const cd=root.querySelector('#packContact'); cd.ontoggle=()=>{PKOPEN=cd.open};
  // redraw only the sheet: a full render here would replace the input while it is losing focus
  root.querySelectorAll('[data-pc]').forEach(inp=>inp.onchange=()=>{PACKC={...PACKC,[inp.dataset.pc]:inp.value.trim()};store.set('packc',PACKC);const a=root.querySelector('.pack');if(a)a.outerHTML=packHTML(PSEL,PLANG,PSC)});
}

/* ---------- owner-test odds (Monte Carlo) ----------
   Seeded draws over end price, hard cost, owner count or lot value, the development-charge rate and DBKL's
   decision. Each draw runs the engine's own model(), so the base case and every golden number stay as they
   are; this is a second view. The same seed always gives the same answer. */
const MC_OUT=[
 ['read','Category B as set','DBKL grants the Category B share set in DBKL incentives (our reading unless you changed it).'],
 ['half','Half eligibility','Existing structures are judged to cover half the site or less, so the redevelopment, residing and open-space components halve (6.0(2)).'],
 ['none','No incentive','DBKL refuses the incentive, or the scheme falls outside the guideline.'],
 ['dbl','Double privilege','The base plot ratio already counts as an incentive, so Category B cannot stack on it (6.0(8)).']];
const MC_DEFAULT={seed:1,n:2000,out:{read:.45,half:.15,none:.30,dbl:.10},dc:[0,.10,.30],hc:[.92,1,1.15],
  site:{taiping:{n:[30,40,80]},salak:{lpsf:[122,160,203]},pantai:{lpsf:[240,300,458]},jinjang_aman:{lpsf:[176,200,229]},jinjang_selatan:{lpsf:[176,200,229]}}};

  salak:{own:'ASKING_LISTING',why:'Village lot asks of about RM122–203 psf of land.'},
  pantai:{own:'INFERRED',why:'No Kampung Pantai lot evidence. The top is a Pantai Murni terrace at about RM458 psf of land.'},
  jinjang_aman:{own:'ASKING_LISTING',why:'Jinjang Utara lot asks of about RM176–229 psf of land.'},
  jinjang_selatan:{own:'ASKING_LISTING',why:'Uses the Jinjang Utara lot asks; no site-specific evidence.'}};
function mcRng(seed){let a=(seed>>>0)||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

function mcCfg(c){
  c=c||MC; const D=MC_DEFAULT, out={};

    site[id]={asp:mcSort3(cs.asp,s.rlv.asp), own:landed?mcSort3(cs.lpsf,ds.lpsf||[o.lpsf*.8,o.lpsf,o.lpsf*1.3]):mcSort3(cs.n,ds.n||[o.n,o.n,o.n]), ownKey:landed?'lpsf':'n'};

    out, dc:mcSort3(c.dc,D.dc).map(v=>Math.max(0,Math.min(1,v))), hc:mcSort3(c.hc,D.hc).map(v=>Math.max(.1,v)), site};

function mcShares(id){return {read:incB(id).share,half:incB(id,{elig:.5}).share,none:0,dbl:0}}
function mcPoint(base,v){

  if(x.owner.mode==='landed') x.owner.lpsf=v.own; else {x.owner.n=Math.max(1,Math.round(v.own)); if(x.owner.form) x.owner.form={...x.owner.form,on:false}}

function mcTornado(id,cfg,base,sh){

    {k:'hc',l:'Hard cost',n:'hard cost',lo:{v:cfg.hc[0],t:fmtRM(base.hc*cfg.hc[0])+' psf',c:at({hcm:cfg.hc[0]})},hi:{v:cfg.hc[2],t:fmtRM(base.hc*cfg.hc[2])+' psf',c:at({hcm:cfg.hc[2]})}},
    landed?{k:'own',l:'Lot value',n:'lot value',lo:{v:R.own[0],t:fmtRM(R.own[0])+' psf',c:at({own:R.own[0]})},hi:{v:R.own[2],t:fmtRM(R.own[2])+' psf',c:at({own:R.own[2]})}}

/* charts: coverage histogram (status colour: short vs clears) and a tornado (low input vs high input) */
function mcHist(r){
  const W=560,H=230,P={l:46,r:14,t:16,b:40}, bw=.05;
  let lo=Math.floor(Math.min(r.q01,.6)/bw)*bw, hi=Math.ceil(Math.max(r.q99,1.3)/bw)*bw; if(hi-lo>4){lo=Math.max(lo,-1);hi=Math.min(hi,3)}
  const nb=Math.max(1,Math.round((hi-lo)/bw)), cnt=new Array(nb).fill(0);
  r.cov.forEach(c=>{const i=Math.min(nb-1,Math.max(0,Math.floor((c-lo)/bw+1e-9)));cnt[i]++});
  const ymax=Math.max(...cnt)/r.N, yt=niceTicks(0,ymax,4), Y1=yt[yt.length-1];
  const X=v=>P.l+(v-lo)/(hi-lo)*(W-P.l-P.r), Y=v=>P.t+(Y1-v)/Y1*(H-P.t-P.b);
  let g='';
  yt.forEach(v=>{g+=`<line class="${v===0?'ax0':'ax'}" x1="${P.l}" x2="${W-P.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="tick" x="${P.l-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${fmtPct(v,0)}</text>`});
  niceTicks(lo,hi,6).filter(v=>v>=lo-1e-9&&v<=hi+1e-9).forEach(v=>{g+=`<text class="tick" x="${X(v).toFixed(1)}" y="${H-P.b+14}" text-anchor="middle">${fmtPct(v,0)}</text>`});
  cnt.forEach((n,i)=>{if(!n)return;const a=lo+i*bw, x0=X(a)+1, x1=X(a+bw)-1, y=Y(n/r.N);
    g+=`<rect class="${a>=1-1e-9?'mc-ok':'mc-bad'}" x="${x0.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,x1-x0).toFixed(1)}" height="${(Y(0)-y).toFixed(1)}"><title>Coverage ${fmtPct(a,0)}–${fmtPct(a+bw,0)}: ${fmtPct(n/r.N,1)} of draws</title></rect>`});
  if(1>=lo&&1<=hi){const x=X(1).toFixed(1);g+=`<line class="mc-ref" x1="${x}" x2="${x}" y1="${P.t-6}" y2="${H-P.b}"/><text class="axl" x="${(+x+5).toFixed(1)}" y="${P.t+4}">100%: owners paid in full</text>`}
  g+=`<text class="axl" x="${(P.l+W-P.r)/2}" y="${H-5}" text-anchor="middle">Owner coverage (residual ÷ owner budget)</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribution of owner coverage across ${r.N} draws; ${fmtPct(r.p,0)} at or above 100%">${g}</svg>
   <div class="leg"><span style="--c:var(--bad)">Short of the owner budget</span><span style="--c:var(--ok)">Clears (100% or more)</span></div>`;
}
function mcTornadoSVG(t){
  const rows=t.rows, W=560, rh=34, P={l:126,r:8,t:22,b:30}, H=P.t+rows.length*rh+P.b;
  const vals=rows.flatMap(r=>[r.lo.c,r.hi.c]).concat([t.centre,1]);
  const xt=niceTicks(Math.min(...vals),Math.max(...vals),6), lo=xt[0], hi=xt[xt.length-1], pad=(hi-lo||1)*.24;
  const X=v=>P.l+(v-lo+pad)/(hi-lo+2*pad||1)*(W-P.l-P.r);

  xt.forEach(v=>{const x=X(v).toFixed(1);g+=`<line class="ax" x1="${x}" x2="${x}" y1="${P.t-4}" y2="${H-P.b}"/><text class="tick" x="${x}" y="${H-P.b+14}" text-anchor="middle">${fmtPct(v,0)}</text>`});

      g+=`<rect class="${cls}" x="${a.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1.5,b-a).toFixed(1)}" height="${bh}"><title>${esc(r.l)} at ${esc(e.t)}: coverage ${fmtPct(e.c,0)}</title></rect>`;

}

function bindOdds(root){

function render(){
  const r=route(), v=document.getElementById('view');
  const views={watchlist:[viewWatchlist,bindWatchlist],map:[viewMap,bindMap],site:[()=>viewSite(r.a||'taiping'),bindSite],lab:[()=>viewLab(r.a),bindLab],deal:[()=>viewDeal(r.a),bindDeal],calibration:[viewCalibration,bindCalibration],board:[viewBoard,bindBoard],incentive:[()=>viewIncentive(r.a),bindIncentive],assembly:[()=>viewAssembly(r.a),bindAssembly],pack:[()=>viewPack(r.a,r.b,r.c),bindPack],odds:[()=>viewOdds(r.a),bindOdds],triggers:[viewTriggers,()=>{}],sources:[viewSources,bindSources],universe:[viewUniverse,bindUniverse],method:[viewMethod,bindMethod]};
  const [fn,bind]=views[r.p]||views.watchlist;
  const y=window.scrollY, same=LAST===location.hash;
  const fid=document.activeElement&&document.activeElement.id;
  v.innerHTML=fn(); bind(v);
  if(same&&fid){const el=document.getElementById(fid);if(el&&el.type==='range')el.focus({preventScroll:true})}
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.p===r.p?'page':'false'));
  if(same) window.scrollTo(0,y); else {window.scrollTo(0,0);v.focus({preventScroll:true})}
  LAST=location.hash;
}
document.getElementById('nav').innerHTML=NAV.map(([p,l,sm])=>`<li><button type="button" data-p="${p}">${l}<small>${sm}</small></button></li>`).join('');
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{const p=b.dataset.p;go('#/'+(p==='site'?'site/'+(MAP.sel||'taiping'):p==='lab'?'lab/'+LAB.site:p==='deal'?'deal/'+DSEL:p==='assembly'?'assembly/'+ASEL:p==='incentive'?'incentive/'+ISEL:p==='pack'?`pack/${PSEL}/${PLANG}/${PSC}`:p==='odds'?'odds/'+MCSEL:p))});
window.addEventListener('hashchange',render);
(function theme(){
  const t=store.get('theme',null); if(t) document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeBtn').onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const n=cur==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); store.set('theme',n);
  };
})();
render();
syncLabel();
initSync();

</script>
</body>
</html>
