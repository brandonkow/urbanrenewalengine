# Runs the full engine check (formula tests, UI sweep, interaction checks) on every push
# and pull request. To make a failing run block merging, add a branch protection rule on
# GitHub that requires the "npm test" check (Settings → Branches).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Render committee memo PDF for inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdftoppm -scale-to 1600 -png memo-review/committee-memo.pdf memo-review/page
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memo-review
          path: memo-review/
          retention-days: 14
      - name: Screenshots for a visual check
        if: always()
        run: npm run shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-build
          path: |
            app/index.html
            package-lock.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
