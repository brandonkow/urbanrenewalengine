# Runs the full engine check (formula tests, UI sweep, interaction checks) on every push
# and pull request. To make a failing run block merging, add a branch protection rule on
# GitHub that requires the "npm test" check (Settings → Branches).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Screenshots for a visual check
        if: always()
        run: npm run shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
